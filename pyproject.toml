[project]
name = "mt5-trading-system"
version = "0.1.0"
description = "Research-driven autonomous trading system for MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    # MetaTrader5 is Windows-only. It is an optional extra so that the
    # research/backtest/test path installs and runs on Linux and macOS too.
]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "config", "infra"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "T20", "BLE", "TRY"]
ignore = [
    "RET504",  # explicit assignment before return is often clearer here
    "N818",    # KillSwitchEngaged / Halt read better without an -Error suffix
    "TRY003",  # long, specific error messages are the point in this codebase
    "TRY300",  # `return` in `try` is fine when the happy path is the try body
    "EM101",   # ditto
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802", "SLF001"]
# Operator-facing entry points: printing IS the interface.
"main.py" = ["T201"]
"scripts/*" = ["T201", "E402"]
"core/startup.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: requires a running MetaTrader 5 terminal (skipped by default)",
]
