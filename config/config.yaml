# =============================================================================
#  Trading system configuration
# =============================================================================
#  Every number the system acts on lives here. Nothing is hardcoded in strategy
#  or risk code. The file is validated against config/schema.py at load time:
#  an unknown key, a missing key, or a value that breaks a hard rule is a
#  startup failure, not a warning.
#
#  Credentials do NOT live here. See config/.env.example.
# =============================================================================

system:
  # backtest | paper | micro_live | scaling
  mode: backtest
  magic_number: 770101
  loop_interval_seconds: 30
  # Open positions are re-checked this often between full cycles. A cycle
  # scans the whole catalogue; open money should not wait on that.
  guard_interval_seconds: 1.0
  kill_switch_file: STOP
  enforce_account_mode_match: true

mt5:
  terminal_path: ""            # empty = let the MT5 package auto-discover
  connect_timeout_ms: 60000
  portable: false
  max_connect_attempts: 5
  reconnect_backoff_seconds: [2, 4, 8, 16, 30]
  order_max_attempts: 3
  order_retry_delay_ms: 250
  read_max_attempts: 3
  read_retry_delay_ms: 50
  deviation_points: 10
  slow_call_warn_ms: 1000

logging:
  level: INFO
  console: true
  console_level: INFO
  directory: logs
  filename: trading.jsonl
  max_bytes: 52428800
  backup_count: 20

data:
  # Highest timeframe first: HTF bias -> MTF zone -> LTF timing.
  timeframes: [D1, H4, H1, M15, M5]
  bars:
    D1: 750
    H4: 1500
    H1: 2000
    M15: 2000
    M5: 2000
  min_bars_required: 200
  stale_after_bars: 3.0
  cache_ttl_seconds: 20.0
  max_gap_fraction: 0.02

instruments:
  # Broker symbol suffix, e.g. ".pro", "m", "_ecn". Leave empty if none.
  symbol_suffix: ""
  symbol_overrides: {}

  # whitelist  = only the symbols listed below may trade.
  # affordable = any symbol the broker offers may be considered; the position
  #              sizer decides what this account can actually express. The
  #              undercapitalised check is exact where a whitelist only guesses.
  universe_mode: whitelist
  blocklist: []

  whitelist:
    # micro_live: FX majors only. Tight spreads, deep liquidity, and the
    # smallest money-per-pip available, which is the only thing that makes a
    # EUR 100 account expressible at all.
    micro_live: [EURUSD, GBPUSD, USDJPY, AUDUSD]
    scaling: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURGBP, EURJPY, GBPJPY, XAUUSD]
    paper: [EURUSD, GBPUSD, USDJPY, AUDUSD]
    backtest: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, XAUUSD]

  # Symbols requiring a minimum equity before they may be traded at all.
  # Gold at 0.01 lot moves USD 1 per USD 1 of price; a normal 8-dollar stop is
  # 8% of a 100-euro account before the setup is even scored.
  min_equity_for_symbol:
    XAUUSD: 500
    XAGUSD: 500
    US30: 2000
    NAS100: 2000
    GER40: 2000
    BTCUSD: 2000

risk:
  # Operative size per trade. Absolute ceiling no mode may exceed: 2%.
  risk_per_trade_pct: 1.0
  max_risk_per_trade_pct: 2.0

  max_concurrent_positions: 2
  # A trade counter is a crude circuit breaker. The binding constraint is the
  # daily loss limit below: at 1% risk a 4% daily stop halts after four losers
  # regardless of how many setups appeared. The count is left generous so a
  # genuinely good day is not truncated, and low enough that a signal-generation
  # bug cannot empty the account before the loss limit catches it.
  max_trades_per_day: 6
  max_trades_per_week: 20

  daily_loss_limit_pct: 3.0
  weekly_loss_limit_pct: 6.0
  max_drawdown_circuit_breaker_pct: 15.0

  min_risk_reward: 2.0

  # Anti-martingale: risk goes DOWN after losses, never up.
  losing_streak_threshold: 3
  losing_streak_risk_multiplier: 0.5

  kelly_fraction: 0.25

  # FX rollover, not midnight — otherwise the daily stop resets mid-session.
  day_boundary_utc: "21:00"
  margin_safety_factor: 2.0

  # Validated as permanently false. Editing these fails the config load.
  forbidden:
    martingale: false
    grid: false
    averaging_down: false
    recovery_lot_increase: false
    trade_without_stop_loss: false

modes:
  backtest:
    max_risk_per_trade_pct: 1.0
    max_sl_pips: 60
    max_trades_per_day: 6
    daily_loss_limit_pct: 3.0
    max_concurrent_positions: 2
    max_journal_detail: true
    min_equity: 0

  paper:
    max_risk_per_trade_pct: 1.0
    max_sl_pips: 60
    max_trades_per_day: 6
    daily_loss_limit_pct: 3.0
    max_concurrent_positions: 2
    max_journal_detail: true
    min_equity: 0

  micro_live:
    # Live money, EUR 100-200. Goal is validating execution, not making money.
    max_risk_per_trade_pct: 2.0
    max_sl_pips: 30
    max_trades_per_day: 6
    daily_loss_limit_pct: 4.0
    max_concurrent_positions: 2
    max_journal_detail: true
    min_equity: 50
    max_equity: 500

  scaling:
    max_risk_per_trade_pct: 1.0
    max_sl_pips: 60
    max_trades_per_day: 6
    daily_loss_limit_pct: 3.0
    max_concurrent_positions: 2
    max_journal_detail: false
    min_equity: 500

filters:
  news:
    enabled: true
    high_impact:
      minutes_before: 60
      minutes_after: 30
    extreme_impact:
      minutes_before: 120
      minutes_after: 60
    extreme_keywords:
      - FOMC
      - Non-Farm
      - Nonfarm
      - NFP
      - CPI
      - Interest Rate Decision
      - ECB Press Conference
      - Fed Chair
      - FOMC Statement
      - Rate Statement
    fail_closed: true               # no calendar -> no trades. Not negotiable.
    open_position_action: break_even
    max_calendar_age_minutes: 180
    refresh_interval_minutes: 30
    # Tried in order, first success wins. At least two are required so one
    # host going down does not stop all trading (the filter fails closed).
    # TradingView was live-verified on 2026-08-09 (180 events, 14 high impact).
    # FairEconomy's next-week endpoint returned HTTP 404 and therefore remains
    # a strict fallback rather than delaying every refresh before TradingView.
    providers: [tradingview, faireconomy]
    cache_path: data/calendar/cache.json

  session:
    enabled: true
    sessions:                        # UTC
      asia:     ["00:00", "08:00"]
      london:   ["07:00", "16:00"]
      newyork:  ["12:00", "21:00"]
    tradable_sessions: [london, newyork]
    rollover_block: ["20:45", "21:15"]
    # 20:15 UTC = 22:15 Amsterdam. From here no new entries AND open positions
    # are flattened: the book thins and spreads widen well before the rollover,
    # and being flat before that happens is the whole point. null switches off.
    evening_flat_from: "20:15"
    block_friday_after: "19:00"
    block_sunday_before: "23:00"
    continuous_asset_classes: [crypto]
    continuous_maintenance_block: ["23:55", "00:10"]
    # These products follow their broker quote and their own exchange/CFD
    # schedule, not the FX London/New York preference. Stale quotes and bad
    # spreads still block them later in the filter chain.
    broker_hours_asset_classes: [stock, index, metal, commodity, unknown]
    # The forced 20:15 flatten is specifically an FX-rollover defence.
    evening_flat_asset_classes: [forex]

  # Does this trade have time to work? The session block above only refuses
  # entries *inside* the wind-down, which leaves the minute before it wide
  # open: an entry at 20:14 clears every gate and is flattened by us at 20:15,
  # having paid the spread twice to learn nothing. That is not a rare edge —
  # it is the last half hour of every trading day.
  runway:
    enabled: true
    # Minutes of clear market an entry must have before its own wind-down.
    min_runway_minutes: 45
    # Per asset class, for anything that resolves on a different clock.
    # Indices already wind down 15 minutes before FX; this would be on top.
    min_runway_by_class: {}
    # Beyond that flat floor, also ask whether *this* target is reachable in
    # the time left at the market's current pace. Net travel over n bars scales
    # with sqrt(n) x ATR, so a 6-ATR target is ~36 bars away, not 6.
    require_reachable_target: true
    # How much better than a random walk we assume a market travels when we
    # have a directional read on it. 1.0 assumes no edge at all; above ~2.5
    # the check stops rejecting anything.
    travel_efficiency: 1.5
    speed_timeframe: M5

  # Is the market awake? Targets are priced in ATR, and a market that has
  # stopped producing ATR cannot reach one. The setup still looks valid and the
  # stop is still the same distance away; the position simply sits there paying
  # the spread until the clock closes it flat-minus-costs.
  liveliness:
    enabled: true
    timeframe: M5
    recent_bars: 6                   # ~30 minutes: how fast is it moving now
    baseline_bars: 120               # ~10 hours of its own normal, as a median
    # Below this fraction of that baseline the market is asleep. Markets
    # breathe; a gate set near 1.0 would never let anything through.
    min_activity_ratio: 0.5
    min_bars: 40
    # A gap can inflate ATR and make a thin CFD look active. These inspect the
    # tape after the gap: occasional missing/flat bars pass, a stuttering feed
    # like SN does not.
    quality_bars: 30
    max_sparse_gap_fraction: 0.10
    max_flat_bar_fraction: 0.60

  spread:
    enabled: true
    max_spread_multiple: 2.0
    min_observations: 200
    retention_days: 60
    # Cross-asset ceiling in basis points of mid-price. This is what makes a
    # $2.70 BTC spread comparable to a 1-pip EURUSD spread.
    max_spread_bps:
      forex: 2.0
      crypto: 5.0
      stock: 20.0
      index: 10.0
      metal: 10.0
      commodity: 20.0
    # How old a quote may be before the instrument is treated as shut. These
    # were written for majors, which tick several times a second, and a live
    # scan showed the cost: USDTRY was refused with a 35-second-old quote and a
    # 0.72 bps spread — an open, perfectly tradeable market thrown out for
    # ticking less often than EURUSD. Liquidity varies by orders of magnitude
    # across a catalogue and quiet is not the same as closed.
    #
    # The numbers below still separate the two easily: every genuinely shut
    # market in that scan was hours or days stale (Australian shares at 3.3
    # hours, US shares at 2.5 days), nowhere near these limits.
    max_tick_age_seconds:
      forex: 180
      crypto: 180
      stock: 300
      index: 180
      metal: 180
      commodity: 300
    absolute_max_pips:              # backstop until the baseline is learned
      EURUSD: 2.0
      GBPUSD: 3.0
      USDJPY: 2.5
      AUDUSD: 3.0
      USDCAD: 3.0
      USDCHF: 3.0
      NZDUSD: 4.0
      EURGBP: 3.0
      EURJPY: 3.5
      GBPJPY: 5.0
      XAUUSD: 50.0

  correlation:
    enabled: true
    max_abs_correlation: 0.7
    lookback_bars: 200
    timeframe: H1

analysis:
  # Context only: classifies closed H1/H4 bars for ranking and Claude. It has
  # zero directional weight and cannot create or veto an entry.
  market_regime:
    enabled: true
    fast_timeframe: H1
    slow_timeframe: H4
    efficiency_lookback: 24
    atr_period: 14
    atr_percentile_lookback: 100
    extreme_atr_percentile: 0.95
    trend_efficiency_min: 0.30
    range_fast_efficiency_max: 0.20
    range_slow_efficiency_max: 0.25
    ranking_modifier_cap: 12.0

  market_structure:
    enabled: true
    signal_timeframe: H1
    bias_timeframe: H4
    internal_swing_lookback: 1
    external_swing_lookback: 3
    atr_period: 14
    bos_close_buffer_atr: 0.05
    equal_level_tolerance_atr: 0.10
    bos_score: 70.0
    minimum_confidence: 0.50
    full_confidence_break_atr: 0.50
  trend_momentum:
    bias_timeframe: H4
    signal_timeframe: H1
    fast_ema: 20
    slow_ema: 50
    slope_lookback: 5
    atr_period: 14
    invalidation_lookback: 12
    score: 65.0
    base_confidence: 0.50
    separation_confidence_scale: 0.20
    maximum_confidence: 0.90
  liquidity_sweep:
    primary_timeframe: M15
    fallback_timeframe: H1
    range_lookback: 20
    minimum_bars: 25
    atr_period: 14
    minimum_depth_atr: 0.0
    score: 75.0
    base_confidence: 0.55
    depth_confidence_scale: 0.25
    maximum_confidence: 0.90
  level_reaction:
    timeframe: H1
    history_lookback: 50
    minimum_bars: 60
    support_quantile: 0.05
    resistance_quantile: 0.95
    atr_period: 14
    proximity_atr: 0.35
    wick_ratio: 1.5
    score: 55.0
    base_confidence: 0.50
    wick_confidence_scale: 0.20
    maximum_confidence: 0.80
  volatility_regime:
    timeframe: H1
    minimum_bars: 120
    atr_period: 14
    percentile_lookback: 100
    compressed_percentile: 0.20
    extreme_percentile: 0.95
  confluence:
    score_threshold: 55.0
    minimum_confidence: 0.45
    minimum_directional_modules: 2
    minimum_agreement_ratio: 0.60
    target_r_multiple: 2.0
    atr_stop_multiple: 1.5
    # A trade is judged by the chart that is expected to pay it. A single D1
    # trend can warn an intraday reversal without pretending that a three-hour
    # trade must reverse the whole week.
    horizon_profiles:
      swing:
        planning_timeframe: H1
        target_horizon_bars: 24
        htf_trend_timeframes: [D1, W1]
        minimum_htf_conflicts: 1
        htf_trend_veto: 1.0
        entry_timing_timeframes: [M15, M5]
      intraday:
        planning_timeframe: M15
        target_horizon_bars: 12
        htf_trend_timeframes: [H4, D1]
        minimum_htf_conflicts: 2
        htf_trend_veto: 1.0
        entry_timing_timeframes: [M5, M1]
    # A trade must be able to pay its own spread. The spread filter asks whether
    # the spread is unusual for this hour; in the evening it is not, and the stop
    # did not widen with it. This is the gate that catches that.
    max_spread_share_of_stop: 0.20
    # Paper/backtest can research every module. Live stays fail-closed until a
    # module has passed the registered out-of-sample protocol.
    live_enabled_modules: []
    weights:
      market_structure: 1.0
      trend_momentum: 1.0
      liquidity_sweep: 0.8
      # 0 — see docs/hypotheses/level_reaction.md. A rolling 5th/95th
      # percentile of the last 50 bars is a statistical artefact, not a level
      # anyone defends, so no counterparty can be named. Kept in the tree so
      # the record of having tried it survives; rewrite against a real level
      # definition (touch count, age, S->R flips, round numbers) before it
      # carries weight again.
      level_reaction: 0.0
      volatility_regime: 0.0

  # Direction and entry price are separate decisions. These ATR-normalised
  # limits stop the market-order path from buying the end of an impulse or
  # selling after a vertical drop. WAIT is temporary: the symbol is analysed
  # again next cycle and can enter after price offers a non-extended retest.
  entry_quality:
    enabled: true
    fail_closed: true
    timeframe: M5
    extension_bars: 3
    range_lookback_bars: 12
    directional_extreme_location: 0.88
    ema_period: 20
    max_favourable_extension_atr:
      forex: 1.25
      crypto: 1.50
      stock: 1.25
      index: 1.35
      metal: 1.35
      commodity: 1.35
      unknown: 1.00
    max_single_bar_body_atr:
      forex: 1.00
      crypto: 1.30
      stock: 1.20
      index: 1.20
      metal: 1.20
      commodity: 1.20
      unknown: 1.00
    max_ema_distance_atr:
      forex: 1.35
      crypto: 1.60
      stock: 1.50
      index: 1.50
      metal: 1.50
      commodity: 1.50
      unknown: 1.20
    max_last_bar_adverse_atr: 0.20
    max_review_price_drift_atr: 0.25
    max_review_latency_seconds: 45

  # Ordering preferences only: never an entry gate, direction change, or risk
  # adjustment. Each market family gets a different microstructure preference.
  asset_class_routing:
    forex:
      module_affinity: {trend_momentum: 2.0, liquidity_sweep: 2.0}
    stock:
      module_affinity: {market_structure: 2.0, trend_momentum: 2.0}
    crypto:
      module_affinity: {trend_momentum: 3.0, liquidity_sweep: 1.0}
    index:
      module_affinity: {market_structure: 2.0, trend_momentum: 2.0}
    metal:
      module_affinity: {trend_momentum: 2.0, liquidity_sweep: 2.0}
    commodity:
      module_affinity: {market_structure: 2.0, trend_momentum: 3.0}
    unknown:
      module_affinity: {}

trade_management:
  pyramiding:
    enabled: false
    max_legs_per_symbol: 2
    min_existing_r: 0.25
    minimum_conviction: 75
    risk_multiplier: 0.5
    minimum_ai_confidence: 0.65
    max_active_symbols: 1
    counts_toward_position_limit: true
  manual_positions:
    enabled: false
    magic_numbers: [0]
    stop_timeframe: M15
    stop_atr_multiple: 1.5
    target_reward_risk: 1.5
  sl_atr_buffer_multiple: 0.5
  sl_atr_period: 14
  break_even_at_r: 0.6
  break_even_offset_atr: 0.1
  partial_close_at_r: 1.5
  partial_close_fraction: 0.5
  trailing_mode: atr
  trailing_atr_multiple: 2.0
  time_exit_hours: 24.0
  time_exit_min_abs_r: 0.3
  # Take what is left when a trade hands back half of a run of 1R or more.
  giveback_arm_r: 0.5
  giveback_fraction: 0.5
  # Hoeveel er terugmag ongeacht wat de gezondheidslezing zegt.
  giveback_hard_fraction: 0.8
  # Eruit als de spread zelf de stop dreigt te raken (zie schema.py).
  spread_squeeze_share: 0.75
  spread_squeeze_min_r: -0.5
  # Per-second read of how the trade is behaving (structure, momentum, adverse
  # run, spread). Can only reduce risk, and needs two signals to close.
  health_enabled: true
  health_fast_bars: 40
  health_structure_bars: 60
  health_secure_at_r: 0.5
  health_tighten_at_r: 0.2
  # Closed-candle health profiles. Slower products are judged on M5/M15 so one
  # unfinished one-minute print cannot look like a broken thesis.
  health_profiles:
    forex: {fast_timeframe: M1, structure_timeframe: M5, fast_bars: 40, structure_bars: 60}
    crypto: {fast_timeframe: M5, structure_timeframe: M15, fast_bars: 48, structure_bars: 64}
    stock: {fast_timeframe: M5, structure_timeframe: M15, fast_bars: 48, structure_bars: 64}
    index: {fast_timeframe: M1, structure_timeframe: M5, fast_bars: 40, structure_bars: 60}
    metal: {fast_timeframe: M1, structure_timeframe: M5, fast_bars: 40, structure_bars: 60}
    commodity: {fast_timeframe: M5, structure_timeframe: M15, fast_bars: 48, structure_bars: 64}
    unknown: {fast_timeframe: M5, structure_timeframe: M15, fast_bars: 48, structure_bars: 64}
  # Claude performs a full routine review every 15 minutes. Between reviews,
  # the one-second local watcher escalates only material changes (health,
  # profit milestones or give-back), with a two-minute cost/noise cooldown.
  supervision_interval_minutes: 15.0
  supervision_event_driven: true
  supervision_min_interval_minutes: 2.0
  supervision_profit_step_r: 0.25
  supervision_giveback_trigger_fraction: 0.25

journal:
  database_path: journal/trading.db
  record_non_trades: true
  snapshot_bars_before: 200
  snapshot_bars_after: 100
  shadow_trades: true

learning:
  shadow_min_days: 30
  shadow_min_paired_outcomes: 100
  shadow_min_unique_days: 20
  shadow_min_symbols: 3
  shadow_min_expectancy_lift_r: 0.05
  shadow_confidence_level: 0.95
  shadow_resolution_hours: 72
  # Only broker-confirmed closed trades count. Until forty comparable trades
  # exist this is exactly neutral; afterwards it can only reorder candidates.
  selection_calibration_enabled: true
  selection_min_trades: 40
  selection_shrinkage_trades: 80
  selection_points_per_r: 6.0
  selection_modifier_cap: 4.0
  selection_refresh_minutes: 15

scanner:
  # null = rank the entire broker catalogue every cycle.
  batch_size: null
  # Top-ranked symbols promoted to full multi-timeframe analysis per cycle.
  deep_candidates: 12

monitoring:
  healthcheck_interval_seconds: 60
  heartbeat_timeout_seconds: 300
  alerts_enabled: false
  alert_channel: none
  reconciliation_enabled: true
  report_interval_minutes: 15
  report_directory: runtime/reports

ai:
  enabled: false
  provider: consensus
  openai_model: gpt-5.1
  anthropic_model: ""              # set explicitly after checking your Anthropic account
  minimum_confidence: 0.65
  # Current Claude models think before answering, so a review takes longer than
  # a plain completion. A timeout is a veto here, and a veto caused by an
  # impatient client is indistinguishable from a real one — leave headroom.
  timeout_seconds: 60
  fail_closed: true
  market_scout:
    enabled: false
    cooldown_minutes: 30
    max_calls_per_day: 24
    max_markets_per_call: 12
    minimum_confidence: 0.65
    ranking_bonus: 8.0
  # Paid pre-trade reviews per cycle, spent best-first. 0 removes the cap.
  max_reviews_per_cycle: 3
