# Broker overlay verified against Eightcap-Live on 2026-08-01.
#
# Use with:
#   python main.py --overlay config/eightcap.yaml --status
#   python jarvis.py --operation experimental_live
#
# Eightcap suffixes FX majors with `.i`, while XAUUSD keeps its canonical name.

instruments:
  symbol_suffix: ".i"
  symbol_overrides:
    XAUUSD: XAUUSD

  # The whole catalogue is considered, and the position sizer decides what a
  # EUR 100 account can actually express. This is not the loosening it looks
  # like: the whitelist was a hand-written guess at affordability, while the
  # sizer measures it exactly, per symbol, at the current equity and the
  # setup's real stop distance. Anything it cannot size at 1% risk is still
  # skipped as TRADE_SKIPPED_UNDERCAPITALIZED.
  universe_mode: affordable
  blocklist: []

  # No hand-written equity floors. They were a guess at what a small account
  # can afford — gold at EUR 500, indices at EUR 2000 — and a guess made before
  # the position sizer existed. The sizer measures it exactly, per symbol, at
  # the current equity and the setup's real stop, and skips anything it cannot
  # express as TRADE_SKIPPED_UNDERCAPITALIZED.
  #
  # Keeping both meant XAUUSD was refused before anyone checked whether this
  # particular setup fitted, purely because the account is under an arbitrary
  # threshold. Gold is now analysed like everything else and skipped only when
  # the arithmetic actually says no.
  min_equity_for_symbol: {}

data:
  # The full ladder, weekly down to one minute. The higher frames set bias, the
  # lower ones are what Claude reads for entry timing — and it uses them: two of
  # the first twelve vetoes were "M15/M5 price action is falling into the entry,
  # directly opposing the long". M1 and W1 extend that in both directions.
  #
  # Each timeframe costs one fetch per symbol per cycle. At 184 eligible markets
  # the five-frame cycle measured 240s; watch the `cycle:` line after this and
  # drop M1 first if it becomes uncomfortable.
  timeframes: [W1, D1, H4, H1, M15, M5, M1]
  bars:
    W1: 400
    D1: 750
    H4: 1500
    H1: 2000
    M15: 2000
    M5: 2000
    M1: 1200      # ~20 hours; entry-timing context, not a history for analysis

  # 200 closed bars is a fair floor for an intraday indicator and an absurd one
  # on a weekly series: it demands four years of history that a broker does not
  # carry for most share CFDs. COFFEE offered 81 weekly bars, STLAM and SPM 77,
  # and all three were thrown out as having no data at all — losing the six
  # timeframes that actually drive the decision over the one that only sets
  # background context.
  min_bars_by_timeframe:
    W1: 50
    D1: 120

  # A London share left 43 bars "missing" out of 2000 — 2.2% against a 2.0%
  # limit. The recurrence rule already forgives the nightly close; what remains
  # is auction periods, half-days and holidays, which every exchange-traded
  # instrument has and spot FX does not. Two percent was a number chosen for a
  # market that trades continuously. Five still catches a feed that dropped a
  # session, which is what the check is for.
  max_gap_fraction: 0.05

scanner:
  batch_size: null        # rank the entire catalogue every cycle

  # Every market that survives the cheap scan gets the full multi-timeframe
  # analysis, not a top-20 slice of it. The cheap scan already threw out
  # everything untradeable — shut exchange, stale quote, spread over the limit,
  # too little history. What remains is roughly 180 live markets, and ranking
  # them by trend strength before analysing them was deciding which setups are
  # worth looking at using a cruder measure than the analysis itself.
  #
  # A cycle over the whole catalogue took one second. There is no budget being
  # protected here. If cycle time climbs into the tens of seconds on a slow
  # terminal, lower this rather than the batch size — the log line reports both
  # the count and the duration.
  deep_candidates: 400

analysis:
  confluence:
    # Measured, not guessed: fed a textbook uptrend, every symbol came back
    # NO_SIGNAL — "too few independent directional modules". Three modules carry
    # weight, and two of them look for opposite things. `trend_momentum` wants
    # continuation; `liquidity_sweep` wants a failed break that closes back
    # inside. A market cannot usually be both, so the second vote almost never
    # arrives and the system analyses forever without ever acting.
    #
    # The second opinion is Claude instead. It sees the same closed bars and the
    # exact executable proposal, it can only veto, and it is fail-closed — no
    # answer means no trade. One module plus an independent reviewer is a real
    # agreement; two modules that cannot fire together is not.
    minimum_directional_modules: 1
    # Explicitly promoted to live. NONE of these has passed the registered
    # out-of-sample protocol yet — `python scripts/audit_live_promotion.py`
    # lists exactly what is still missing, and the runner alerts on it at every
    # experimental-live start. This line is the deliberate, reviewable act of
    # accepting that; nothing promotes a module to live on its own any more.
    live_enabled_modules: [market_structure, trend_momentum, liquidity_sweep]

# Experimental live uses Claude as a mandatory final veto gate. The API key
# stays in config/.env, is never committed, and is never sent to the dashboard.
ai:
  enabled: true
  provider: anthropic
  anthropic_model: claude-sonnet-5
  # An approval below this is silently converted into a veto, which is how a
  # run of seventy-four vetoes happened: Claude was answering 0.60-0.62 against
  # a 0.65 bar, so even the setups it judged sound were flipped. 0.55 is the
  # level the prompt now defines as "I would not take this", which is the only
  # number this threshold should mean.
  minimum_confidence: 0.55
  timeout_seconds: 60
  fail_closed: true
