# Broker overlay verified against Eightcap-Live on 2026-08-01.
#
# Use with:
#   python main.py --overlay config/eightcap.yaml --status
#   python jarvis.py --operation experimental_live
#
# Eightcap suffixes FX majors with `.i`, while XAUUSD keeps its canonical name.

instruments:
  symbol_suffix: ".i"
  symbol_overrides:
    XAUUSD: XAUUSD

  # The whole catalogue is considered, and the position sizer decides what a
  # EUR 100 account can actually express. This is not the loosening it looks
  # like: the whitelist was a hand-written guess at affordability, while the
  # sizer measures it exactly, per symbol, at the current equity and the
  # setup's real stop distance. Anything it cannot size within the active risk
  # contract (2% in Experimental Live) is still skipped as
  # TRADE_SKIPPED_UNDERCAPITALIZED.
  universe_mode: affordable
  # OLIE ERUIT, tijdelijk en op een dunne steekproef. Dat laatste staat er
  # expliciet bij omdat het de zwakte van dit besluit is.
  #
  # UKOUSD: 4 trades, 0 gewonnen, -18,05 EUR. Dat is 84% van een verlies van
  # -21,57 EUR over twee dagen; zonder olie komen diezelfde twee dagen uit op
  # -2,29 EUR. Eén instrument, vier trades, vier vijfde van de schade.
  #
  # VIER TRADES IS GEEN BEWIJS. Bij een boek dat rond de 70% wint is 0 uit 4
  # ongeveer 1 op de 123 puur door pech — opvallend, niet vaststaand. Waarom
  # dan toch nu en niet na meer data: de kosten staan scheef. Blokkeren en
  # ongelijk hebben kost een handvol gemiste olietrades. Niet blokkeren en
  # ongelijk hebben kost mogelijk nog eens 18 EUR op een rekening van 214, en
  # dat is 8%. Bij die verhouding wacht je niet op zekerheid.
  #
  # USOUSD staat er OOK op, ook al is die nooit gemeten. Brent en WTI lopen
  # vrijwel gelijk: alleen UKOUSD blokkeren verplaatst dezelfde trade naar
  # USOUSD en levert precies niets op. De stelling is "olie gedroeg zich
  # anders", niet "Brent gedroeg zich anders".
  #
  # `blocklist` en niet `ignored_symbols`: dit weigert alleen een NIEUWE
  # entry. Een openstaande olieticket blijft gewoon beheerd, met stop, met
  # health-monitoring. `ignored_symbols` zou hem laten vallen.
  #
  # WANNEER DIT ERAF MAG. Twee vragen, allebei te beantwoorden met
  # `scripts/scorecard.py --days 7 --exclude-regime transition`:
  #   1. Zaten die vier trades in `transition`? Dan zijn ze al geweigerd door
  #      de regimeblokkade en is deze regel overbodig.
  #   2. Wat zegt `WHICH DETECTOR, IN WHICH REGIME` over olie op meer data?
  # Een gemeten reden om hem terug te zetten weegt zwaarder dan deze regel.
  blocklist: [UKOUSD, USOUSD]
  # Gold is deliberately owned outside Jarvis: not opened, adopted, managed,
  # closed, flattened or counted. Stronger than a blocklist entry — even an
  # already-open XAUUSD ticket remains untouched.
  #
  # It moved from `ignored_symbols` to `observation_only_symbols` on 24 August,
  # on the owner's instruction to make gold readable for section six. Three of
  # the four guarantees are unchanged and the fourth is the one that was in the
  # way:
  #
  #   opened / adopted    still no — refused as SYMBOL_OBSERVATION_ONLY
  #   managed / closed    still no — `is_hands_off` covers both lists
  #   counted in risk     still no — same predicate
  #   SCANNED             now YES, and that is the whole change
  #
  # A paper section needs a MarketContext for the symbol and an ignored symbol
  # never gets one, so gold was invisible to the very thing meant to read it.
  # Scanning it produces analysis rows in the journal and nothing else; no
  # order can be built from it, because the entry gate refuses the symbol by
  # name before sizing is ever reached.
  ignored_symbols: []
  observation_only_symbols: [XAUUSD]

  # No hand-written equity floors. They were a guess at what a small account
  # can afford — gold at EUR 500, indices at EUR 2000 — and a guess made before
  # the position sizer existed. The sizer measures it exactly, per symbol, at
  # the current equity and the setup's real stop, and skips anything it cannot
  # express as TRADE_SKIPPED_UNDERCAPITALIZED.
  #
  # Keeping both meant XAUUSD was refused before anyone checked whether this
  # particular setup fitted, purely because the account is under an arbitrary
  # threshold. Gold is now analysed like everything else and skipped only when
  # the arithmetic actually says no.
  min_equity_for_symbol: {}

  # WHICH MARKETS ARE LOOKED AT. Empty means everything; this is the one knob
  # for how long a trade ties up a slot.
  #
  # The stop is 1.5 ATR and the target twice that, so measured in *market hours*
  # every class reaches its target in about the same time. What differs is how
  # many hours a week the market is open to travel it:
  #
  #     FX, metals, crypto   120 open hours/week  ->  ~2 calendar days to target
  #     LSE / Milan shares    42 open hours/week  ->  ~6 calendar days
  #
  # With two position slots, a six-day trade holds half the account's capacity
  # for a week. That is the real cost of the slow markets, not their quality.
  #
  # Values: forex, metal, index, commodity, stock, crypto.
  #
  # Terug naar deze vier na een nacht meten met de volledige catalogus. Dat
  # experiment leverde in twaalf uur 83.183 beslissingen op en nul trades, en
  # de reden stond in het journaal:
  #
  #   DATA_QUARANTINED    36.835  44,3%   broker heeft de historie niet
  #   DATA_UNAVAILABLE     6.231   7,5%   idem
  #   CORRELATED_EXPOSURE  2.801           66% van alles dat een signaal werd
  #
  # Meer dan de helft van al het werk ging naar losse aandelen waarvan de
  # broker geen bruikbare balken levert. Van wat er wél doorheen kwam sneuvelde
  # twee derde op correlatie, en terecht: op H1 over 200 balken bewegen de
  # Britse en Europese aandelen vrijwel allemaal boven 0,7 mee met hun index.
  # RR, MB, ENR en AAL naast een open UK100 zijn niet vier trades maar één
  # trade met vier lots erop, en de poort weigerde dat correct.
  #
  # Analyseer iedere assetklasse die de Eightcap-terminal aanbiedt. De scanner
  # houdt de liquide kern (FX/crypto en de expliciete priority-symbolen) iedere
  # cyclus vooraan en roteert daarna door de rest. Zo verdwijnen aandelen en
  # commodities niet uit beeld, zonder dat één volledige cataloguspass van
  # ongeveer drie minuten een verse M1/M5-entry oud maakt.
  #
  # Dit opent geen risicopoort: spread, brokerstatus, betaalbaarheid, margin,
  # correlatie, sizing en de AI/local-history review blijven per order gelden.
  # `stock` is eraf, en dat is op bewijs van dit account in plaats van op smaak.
  #
  # Vier gevallen, allemaal losse aandelen, allemaal een ander mankement:
  #
  #   ENR   -3,61R op een BROKER_SL. Een stop kost per definitie 1,00R, dus er
  #         ging 2,61R doorheen. De beurs was dicht en het aandeel opende
  #         ergens anders. De stop stond er; er was geen markt om hem te vullen.
  #   QIA   36,6349 / 36,6550 - 2,01 cent spread - met M1-bars van een paar
  #         punten. Erin en eruit kostte meer dan de markt in een minuut bewoog.
  #   ANTO  2 cent spread op EUR 36,34, en bars van twee tot vijf cent. Die komt
  #         langs het liveliness-filter, want hij BEWEEGT wel. De kosten zijn
  #         alleen zo'n groot deel van elke beweging dat de spread de uitkomst
  #         bepaalt in plaats van de analyse.
  #   ba, con, dbk  drie stuks tegelijk open met een gesloten beurs. Niet te
  #         sluiten, geen stop te verzetten, en ze hielden drie van de vier
  #         slots bezet.
  #
  # Wat die vier delen: op een rekening van EUR 130 is een CFD op een los
  # aandeel van EUR 36 met twee cent spread geen instrument om mee te handelen.
  # De spread is 0,055% van de prijs, de beurs staat zestien uur per dag stil,
  # en er is geen drempel die dat repareert - ik heb het twee keer geprobeerd en
  # ANTO glipt er alsnog door. Het is de assetklasse zelf.
  #
  # De avonduitfasering voor aandelen en `min_bar_range_in_spreads` blijven
  # staan. Ze zijn nu geen actieve poort meer maar een vangnet: zet iemand
  # `stock` ooit terug, dan gelden ze meteen weer.
  #
  # Indices blijven WEL staan. Die volgen dezelfde beurs maar zijn een index-CFD
  # met een spread van een fractie hiervan en een boek dat vrijwel dag en nacht
  # quoteert. UK100 leverde gisteren de enige schone trade van de dag op
  # (+1,45R, BROKER_TP, 96% van zijn top gehouden).
  # `stock` staat er weer op, maar nu bewaakt door een MEETING in plaats van
  # door een verbod. De eigenaar wil alles scannen behalve markten met gaatjes
  # of zonder beweging, en dat is precies wat `max_gap_atr` en
  # `min_bar_range_in_spreads` nu per instrument beoordelen.
  #
  # Waarom een meting beter is dan de klasse: het echte mankement van ENR was
  # niet dat het een aandeel is, maar dat het 2,61R DOOR een stop opende die per
  # definitie 1,00R kost. Een aandeel dat niet springt houdt zijn stop en mag
  # meedoen; een valutapaar dat wel zou gaan springen wordt op hetzelfde bewijs
  # geweigerd. De klasse was een proxy, dit is het ding zelf.
  #
  # Wat er dan nog overeind staat voor aandelen: de avonduitfasering om 15:30
  # UTC, `INSUFFICIENT_RUNWAY` op datzelfde venster, en de kostenpoorten.
  asset_classes: [forex, metal, index, commodity, stock, crypto]

  # Or watch a single instrument. Leave empty for the list above; set e.g.
  # [XAUUSD] to look at nothing else. Blunt on purpose — everything excluded
  # stops being seen, including better setups elsewhere.
  symbols_only: []

data:
  # The full ladder, weekly down to one minute. The higher frames set bias, the
  # lower ones are what Claude reads for entry timing — and it uses them: two of
  # the first twelve vetoes were "M15/M5 price action is falling into the entry,
  # directly opposing the long". M1 and W1 extend that in both directions.
  #
  # Each timeframe costs one fetch per symbol per cycle. At 184 eligible markets
  # the five-frame cycle measured 240s; watch the `cycle:` line after this and
  # drop M1 first if it becomes uncomfortable.
  timeframes: [W1, D1, H4, H1, M15, M5, M1]

  # NIETS IN DIT SYSTEEM LEEST OOIT MEER DAN 400 BARS.
  #
  # Nagelopen over de hele repo, elke tail() en elke slice: het diepste venster
  # dat bestaat is 400 — `_reachable_target`, `measure_target_reach`, de
  # playbooks, de reviewpayload en de gap-teller van de liveliness-filter zitten
  # daar allemaal op. Daaronder: `atr_percentile_lookback` 100,
  # `lookback_bars` 200, `min_bars_required` 200. Er werden er 2000 opgehaald.
  #
  # Wat dat kostte, uit de cyclusregel van 14:42: 432/843 gescand in 118s met
  # `slow MT5 calls` ervoor. M5 verliest zijn cache elke vijf minuten en een
  # symbool komt bij 240 per cyclus ongeveer elke zeven minuten terug, dus die
  # 2000 M5-bars gingen per symbool per ronde opnieuw over de lijn. Bij 185
  # geanalyseerde symbolen is dat een half miljoen bars per cyclus voor een
  # verbruik van 400.
  #
  # 600 en niet 400: dat laat 200 bars lucht boven het diepste venster, ruim
  # genoeg voor een weekendgat of een halve handelsdag, en het blijft boven de
  # `min_bars_required: 200` vloer.
  #
  # Dit is dezelfde redenering als `batch_size: 240` hierboven en het is waar de
  # extra kansen vandaan komen: een cyclus die afmaakt levert per minuut meer
  # bruikbare setups dan een cyclus die halverwege blijft hangen. Kijk na een
  # herstart naar de seconden in de `cycle:` regel; dat is de hele test.
  # H4 STAAT WEER OP 1500 EN DAT IS EEN TERUGDRAAI VAN MIJN EIGEN FOUT.
  #
  # Met H4 op 600 bars sloeg de gap-controle om: elk beursgenoteerd symbool
  # rapporteerde `H4: 30 bars missing inside trading weeks (5.0% of the window,
  # limit 5.0%)` en ging in quarantaine. Dertig ontbrekende bars is bij 600 het
  # getal waar de 5%-limiet precies ligt (5.0083% tegen 5.0000%); bij 1500 is
  # datzelfde aantal 2.0% en ruim binnen.
  #
  # Wat het kostte, gemeten over zes live uren:
  #
  #     DATA_QUARANTINED    74 van  8.620 =  0.9%   (H4 1500, vanochtend)
  #     DATA_QUARANTINED 11.430 van 25.373 = 45.0%  (H4  600, daarna)
  #
  # Bijna de halve catalogus, weggegooid door een verandering die de cyclus
  # sneller moest maken. T, GOOGL, MDT, JNJ, VZ, XOM, AMZN — allemaal met
  # dezelfde regel en allemaal H4.
  #
  # De snelheidswinst zit sowieso niet hier: H4 wordt maar eens per vier uur
  # opnieuw opgehaald. M5 verliest zijn cache elke vijf minuten en dat is waar
  # de 425.000 bars per cyclus vandaan kwamen. Die blijven op 600.
  bars:
    W1: 400
    D1: 500
    H4: 1500
    H1: 600
    M15: 600
    M5: 600
    # 300, niet 1200. M1 is de enige reeks die zijn cache elke cyclus verliest
    # - een minuutbar sluit elke minuut, en een cyclus duurt er ongeveer een -
    # dus dit is de enige regel in deze tabel die per cyclus 67 keer opnieuw
    # over de lijn moet. De rest wordt pas opgehaald als er echt een nieuwe bar
    # gesloten is, en dat is bij H1 een keer per uur en bij D1 een keer per dag.
    #
    # Wie leest hem eigenlijk:
    #   momentum_scalp    15 bars (een M1-ATR plus vijf bars drift)
    #   de adviseur       30 bars (_BARS_SENT)
    #   de bewakingslus   haalt zijn eigen bars direct op, los van deze tabel
    #
    # Er werden er dus 1200 opgehaald voor een verbruik van 30. De vloer is
    # `min_bars_required: 200`, en 300 laat daar wat lucht boven voor een
    # weekendgat zonder de rest van de dag mee te slepen.
    M1: 300

  # 200 closed bars is a fair floor for an intraday indicator and an absurd one
  # on a weekly series: it demands four years of history that a broker does not
  # carry for most share CFDs. COFFEE offered 81 weekly bars, STLAM and SPM 77,
  # and all three were thrown out as having no data at all — losing the six
  # timeframes that actually drive the decision over the one that only sets
  # background context.
  min_bars_by_timeframe:
    W1: 50
    D1: 120

  # A London share left 43 bars "missing" out of 2000 — 2.2% against a 2.0%
  # limit. The recurrence rule already forgives the nightly close; what remains
  # is auction periods, half-days and holidays, which every exchange-traded
  # instrument has and spot FX does not. Two percent was a number chosen for a
  # market that trades continuously. Five still catches a feed that dropped a
  # session, which is what the check is for.
  max_gap_fraction: 0.05

scanner:
  # EEN CYCLUS MOET AF KUNNEN, ANDERS BESTAAT ER GEEN CYCLUS.
  #
  # `batch_size: null` betekent "de hele catalogus in één cyclus". Met aandelen
  # eruit was dat 231 symbolen en 59 seconden. Met aandelen er weer bij is het
  # 800+ en dan komt de cyclusregel simpelweg niet meer in het log: vijf minuten
  # na de launch stond er alleen `slow MT5 calls` en `symbol held out of deep
  # analysis`. Er werd wel gescand, maar niks werd ooit afgemaakt, en een M1- of
  # M5-instap die drie minuten oud is bestaat niet meer.
  #
  # 240 per cyclus, met de liquide kern ELKE cyclus vooraan. Dat is precies het
  # ontwerp dat `instruments.asset_classes` hierboven al beschrijft en dat nooit
  # aan is gezet: forex, crypto en de priority-symbolen worden elke keer verse
  # data, en de rest van de catalogus roteert erachter langs in drie of vier
  # cycli. Zo zie je alles binnen een paar minuten zonder dat een van die
  # minuten een entry oud maakt.
  #
  # Dit is waar de "meer kansen" vandaan komt en niet uit een lossere poort: een
  # cyclus die afmaakt levert per minuut meer bruikbare setups dan een cyclus
  # die halverwege blijft hangen, hoeveel symbolen hij ook aanraakt.
  batch_size: 240
  priority_every_cycle: true

  # MARKTEN MET EEN HOGE SPREAD ERUIT.
  #
  # Een scan over 845 markten: 124 van de 136 cryptoparen geblokkeerd op
  # spread, met een klassemediaan van 1.581 bps. Dat is zestien procent van de
  # prijs en negenenzeventig keer de limiet van 20. Zulke markten worden niet
  # tegen lunchtijd smaller, ze worden zo gequote. Voor elk van hen elke ronde
  # opnieuw een contract en een tick ophalen, op één vCPU, is tijd die niet
  # naar de markten gaat waar wel in te handelen valt.
  #
  # Dit verandert NIETS aan wat verhandeld mag worden. Elk symbool dat hier
  # wordt vastgehouden was al geweigerd om precies deze reden en wordt nog
  # steeds geweigerd; de weigering wordt alleen zes uur onthouden in plaats van
  # elke ronde opnieuw uitgerekend. De kandidatenlijst kan hier krimpen en
  # nooit groeien.
  #
  # De factor 2,0 is wat het eerlijk houdt. Wat net over de limiet zit -
  # XAGUSD op 8,40 tegen 8,0, BNBUSD op 24,99 tegen 20 - wordt NOOIT
  # vastgehouden: dat kan binnen het uur smaller worden en wordt elke ronde
  # gewoon opnieuw gemeten. Alleen wat mijlenver over de streep ligt gaat weg.
  #
  # 0.0 uur zet het uit en dan meet hij weer alles, elke ronde.
  wide_spread_park_multiple: 2.0
  wide_spread_park_hours: 6.0

  # Every market that survives the cheap scan gets the full multi-timeframe
  # analysis, not a top-20 slice of it. The cheap scan already threw out
  # everything untradeable — shut exchange, stale quote, spread over the limit,
  # too little history. What remains is roughly 180 live markets, and ranking
  # them by trend strength before analysing them was deciding which setups are
  # worth looking at using a cruder measure than the analysis itself.
  #
  # A cycle over the whole catalogue took one second. There is no budget being
  # protected here. If cycle time climbs into the tens of seconds on a slow
  # terminal, lower this rather than the batch size — the log line reports both
  # the count and the duration.
  # Above Eightcap's complete current catalogue (847 rows): every symbol that
  # survives the cheap tradability/quote/spread/history screen receives the
  # full timeframe ladder. This is a coverage choice, not a looser trade gate.
  deep_candidates: 2000

  # Three selection lanes. The complete catalogue is still inspected and
  # analysed, but scarce position slots and paid Claude reviews go to familiar,
  # liquid markets first. Only when those produce no executable proposal does
  # the queue reach single-name shares and less liquid CFDs.
  priority_asset_classes: [forex, crypto]
  priority_symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
    - USDCHF
    - AUDUSD
    - USDCAD
    - NZDUSD
    - EURJPY
    - GBPJPY
    - EURGBP
    - BTCUSD
    - ETHUSD
    - SOLUSD
    - XRPUSD
    - XAUUSD
    - US30
    - US500
    - NAS100
    - US2000
  # Inside a lane, a spread at 10% of the class cap receives nine more ranking
  # points than one sitting at the cap. Directional evidence still decides the
  # trade; this only stops expensive execution from winning a close comparison.
  priority_spread_weight: 10.0

  # Welke setup houdt het meeste over van wat hij wint.
  #
  # De volgorde werd bepaald door conviction (score x confidence, 16-76 punten)
  # en dat getal is op deze rekening twee keer gemeten als niet-voorspellend:
  # de emmer "20+ boven de lat" was de slechtste met -4,92R over 23 trades, en
  # van 84 betaalde reviews leverde de band 40-45 nul bruikbare antwoorden op
  # terwijl 20-25 er 33% gaf. De wachtrij stond dus vrijwel volledig op ruis.
  #
  # De tol is geen ruis. Op echte fills gaf elke live trade meer dan een kwart
  # van zijn risico uit aan commissie en slippage, en dat telde alleen mee als
  # spread-voorkeur die niet naar het doel keek — dezelfde 2 pips spread scoort
  # gelijk tegen een doel van 40 pips en een van 6, terwijl het in het eerste
  # geval een afronding is en in het tweede de helft van de winst.
  #
  # Dit scoort welk deel van de reward-to-risk de rondgang overleeft. Geen
  # voorspelling, een aftreksom. Wat het in de praktijk doet:
  #
  #   stop 20 pips, doel 40, krappe spread   11,3 van 12
  #   stop 10 pips, doel 30, krappe spread   10,8
  #   stop 10 pips, doel 30, spread 2 pips    8,7
  #   stop 1,8 pips, doel 3,6 (de live ones)  6,2
  #
  # Alleen volgorde, net als al het andere in de selectiescore: het bepaalt wie
  # als eerste bekeken wordt en wie een schaarse betaalde review krijgt. Het
  # kan niets goedkeuren wat een poort geweigerd heeft. 0.0 zet het uit.
  after_cost_priority_weight: 12.0

# Rio Traders phone bridge is temporarily disabled while the owner evaluates a
# separate cloud copy-trader. Keep the settings so this remains a one-line,
# reversible switch; with `enabled: false` Jarvis neither opens the receiver nor
# reads, executes or manages any incoming Rio notification.
external_signals:
  enabled: false
  source: rio
  listen_host: 127.0.0.1
  listen_port: 8765
  token_env: RIO_SIGNAL_TOKEN
  inbox_path: runtime/external_signals
  max_age_seconds: 180
  fixed_volume: 0.01
  partial_close_fraction: 0.5
  entry_zone_tolerance_bps: 2.0
  # Rio is the directional authority for Gold only. Jarvis supplies missing
  # protection from closed M5 structure/ATR, but the broker, calendar, spread,
  # margin, hard STOP and capital floor remain non-negotiable execution facts.
  gold_follow_enabled: false
  gold_follow_aliases: [GOLD, XAUUSD]
  gold_follow_timeframe: M5
  gold_follow_structure_bars: 24
  gold_follow_stop_atr_multiple: 1.5
  gold_follow_structure_buffer_atr: 0.25
  gold_follow_target_reward_risk: 1.2
  gold_follow_max_entry_deviation_atr: 0.75
  gold_follow_max_entry_deviation_bps: 8.0
  allowed_apps: [Rio Traders]
  symbol_aliases:
    GOLD: XAUUSD
    XAUUSD: XAUUSD

analysis:
  # HET DOEL VAN 2R VIA 1.5R NAAR 1.2R, en dit is de grootste enkele oorzaak dat er
  # niets handelt. Gemeten, niet beredeneerd.
  #
  # Van alles wat de entry-poorten overleeft sterft 95,8% op de kostenstap, en
  # 313 van die 391 zijn TARGET_RARELY_REACHED. Wat het rapport letterlijk zei:
  #
  #   AUDCHF  30,4% bereikt   GBPCAD 30,7%   GBPCHF 30,2%   CADJPY 30,2%
  #
  # Break-even voor een 2R-plan is 33,3%. Die markten leggen de doelafstand dus
  # simpelweg niet vaak genoeg af. Dat is geen strenge poort, dat is rekenkunde.
  #
  # WAAROM EEN KORTER DOEL DIT OPLOST, en waarom het niet vanzelf spreekt: de
  # bereikkans stijgt sneller dan de break-even eis als het doel krimpt. Op
  # dezelfde instrumenten, geijkt op die 30,4%:
  #
  #   RR      bereikt   nodig   marge
  #   2,50     19,9%    28,6%   -8,7
  #   2,00     30,4%    33,3%   -2,9   <- waar hij nu staat
  #   1,75     36,8%    36,4%   +0,4
  #   1,50     44,1%    40,0%   +4,1
  #   1,20     53,7%    45,5%   +8,2   <- hierheen
  #
  # WAT DIT KOST EN WAT ER GEWED WORDT. Een dichter doel levert minder op per
  # winnaar en heeft dus een hogere vereiste winrate, maar wordt in de gemeten
  # horizon veel vaker bereikt. De reach-meting blijft een poort: een dichter
  # doel maakt een slechte richting niet vanzelf goed. Of de modules het gat na
  # werkelijke spread, commissie en slippage dichten is nog niet aangetoond.
  #
  # `scorecard.py --days 3` leest het terug. Deze wijziging moet op nieuwe data
  # worden beoordeeld; meer trades is volume, geen bewijs van een edge.
  # De waarde zelf staat in het confluence-blok verderop.

  # De poort die de eigenaar bij naam noemde: "XAUUSD flipte omhoog als een
  # rocket en hij greep niet in".
  #
  # Dat was deze. `directional_extreme_location: 0.88` weigerde elke entry in de
  # bovenste 12% van de laatste twaalf M5-bars. Maar een markt die uitbreekt
  # ZIT bij de top van zijn recente range — dat is wat uitbreken is. Een poort
  # die "vlakbij de high" leest als "te laat" weigert dus elke impuls die hij
  # ooit te zien krijgt en houdt alleen de suffe over.
  #
  # `scorecard.py` heeft er een prijs op gezet: ENTRY_OVEREXTENDED blokkeerde 3
  # setups, 2 daarvan wonnen, en het kostte 3,00R.
  #
  # Naar 0,95, en `max_favourable_extension_atr` mee omhoog omdat dát nu de
  # poort is die het werk doet — die vraagt hoe ver prijs werkelijk gelopen is
  # in plaats van alleen waar hij zit. Wat onaangeroerd blijft:
  # `max_single_bar_body_atr` (één explosieve bar is nog steeds een chase) en
  # `max_ema_distance_atr` (te ver van de EMA blijft te ver).
  # TWEEDE RONDE, 13 augustus, op het live-log van een uur na de eerste.
  # ENTRY_OVEREXTENDED bleef 65 keer per uur vuren — maar op een ANDERE
  # sub-poort dan degene die ik hierboven had losgedraaid. Wat de weigeringen
  # letterlijk zeiden:
  #
  #   XAUGBP  LONG  EMA distance 1.97 > 1.50 ATR
  #   XAUJPY  LONG  EMA distance 2.17 > 1.50 ATR
  #   XAUAUD  LONG  EMA distance 2.41 > 1.50 ATR
  #   EURCHF  SHORT 3-bar move 2.57 > 1.75 ATR, last body 1.02 > 1.00 ATR
  #   CADCHF  SHORT 3-bar move 1.87 > 1.75 ATR, last body 1.06 > 1.00 ATR
  #   EURTRY  LONG  laatste M5-bar loopt 0.64 ATR tegen -> AWAITING_CONFIRMATION
  #
  # Die eerste drie zijn precies de klacht van de eigenaar: goud vloog omhoog
  # en het systeem keek toe. Een markt die hard loopt IS ver van zijn EMA — dat
  # is wat hard lopen betekent — dus een poort op 1,50 ATR weigert per definitie
  # elke krachtige beweging en houdt alleen de trage over.
  #
  # WAT ER OVERBLIJFT als bescherming, en dat is geen niets: de setup heeft nog
  # steeds een stop nodig die de sizer kan uitdrukken, een target dat deze markt
  # aantoonbaar haalt, een spread die in de stop past, kosten onder 25% van het
  # risico, genoeg margin, en Claude's veto. Wat weg is, is de aanname dat "ver
  # gelopen" hetzelfde is als "te laat".
  entry_quality:
    # DERDE RONDE, 17 augustus, en deze keer terug omlaag.
    #
    # Het argument hierboven klopt nog steeds: een uitbraak ZIT bij de top van
    # zijn range, en 0,88 weigerde elke impuls. Maar 0,95 is geen poort meer,
    # het is een formaliteit - alles behalve letterlijk de hoogste tick komt
    # erdoor. Tussen "weiger elke impuls" en "weiger niks" ligt een middenweg en
    # die was niet geprobeerd.
    #
    # Wat het kostte, gemeten op de trade zelf. GBPUSD LONG om 19:01: range van
    # de laatste twaalf M5-bars 1,35559 tot 1,35646, entry op 1,35639. Dat is
    # 92% van de weg naar de top - de piek van een spike die daarna meteen
    # terugviel naar 1,35609. UK100 LONG op 10732,25 hetzelfde verhaal, eruit op
    # 10723,55 voor -6,10.
    #
    # 0,80 laat kracht kopen toe en weigert de bovenste vijfde. Beide trades
    # hierboven vallen af; een uitbraak die op 70% van zijn range instapt niet.
    #
    # ENTRY_OVEREXTENDED kostte 3,00R over 3 setups toen dit werd losgezet. Het
    # is sindsdien 1 setup en 1,20R - en de twee trades hierboven kostten samen
    # 7,65R. Dat is de rekening van de andere kant, en die is groter.
    directional_extreme_location: 0.80
    # Hoe ver prijs van zijn EMA20 mag staan. Dit was de poort die goud sloeg.
    max_ema_distance_atr:
      forex: 2.25
      crypto: 2.75
      stock: 2.50
      index: 2.50
      metal: 2.75
      commodity: 2.50
      unknown: 2.00
    # Eén explosieve bar blijft een chase, maar 1,00 ATR is de body van een
    # volle candle zonder lont — dat is een normale krachtige bar, geen spike.
    max_single_bar_body_atr:
      forex: 1.50
      crypto: 1.80
      stock: 1.70
      index: 1.70
      metal: 1.70
      commodity: 1.70
      unknown: 1.40
    # A breakout may be strong, but paying at the directional edge after one
    # oversized final bar is the EURAUD buy-high failure. This is WAIT_RETEST,
    # not a deleted setup; a normal next bar can release it immediately.
    max_extreme_single_bar_body_atr:
      forex: 0.75
      crypto: 1.10
      stock: 1.00
      index: 1.00
      metal: 1.10
      commodity: 1.00
      unknown: 0.80
    # Een terugloop die nog beweegt is nog geen retest — maar 0,20 ATR is
    # gewone ruis op een M5-bar, niet "de pullback loopt nog".
    max_last_bar_adverse_atr: 0.70
    # FRA40 was sold from a two-bars-old 2 ATR impulse without a fresh resume.
    # Keep the setup, but require the current M5 bar to take over from an old
    # impulse before paying the market price.
    stale_impulse_after_bars: 1
    stale_impulse_min_resumption_atr: 0.05
    max_favourable_extension_atr:
      forex: 2.75
      crypto: 3.00
      stock: 2.75
      index: 2.85
      metal: 3.00
      commodity: 2.85
      unknown: 2.25
    # Houd de ruime CLOSED-bar breakoutdetectie hierboven intact, maar betaal
    # niet nogmaals een verticale LIVE candle erbovenop. Dit vormt geen setup
    # minder: het verandert ENTER_NOW tijdelijk in WAIT_RETEST en dezelfde
    # markt wordt de volgende cyclus opnieuw bekeken.
    max_live_favourable_gap_atr:
      forex: 0.75
      crypto: 1.00
      stock: 0.90
      index: 0.90
      metal: 1.00
      commodity: 1.00
      unknown: 0.75
    lifecycle_enabled: true
    lifecycle_pullback_atr: {quick: 0.20, intraday: 0.30, swing: 0.40}
    lifecycle_resumption_atr: {quick: 0.05, intraday: 0.08, swing: 0.10}
    lifecycle_expiry_minutes: {quick: 30, intraday: 240, swing: 1440}

  confluence:
    # Deze rekening handelt niet in `transition`.
    #
    # 90 gesloten trades over vier dagen, gesneden op wat `market_regime` bij
    # entry las:
    #
    #     transition   44 trades  59% gewonnen  -20,86 EUR   -0,47 per trade
    #     trend_down   11 trades  55% gewonnen  -11,75 EUR   -1,07 per trade
    #     trend_up     21 trades  90% gewonnen  +22,44 EUR   +1,07 per trade
    #     range         6 trades 100% gewonnen   +9,57 EUR   +1,59 per trade
    #     extreme       8 trades 100% gewonnen   +9,25 EUR   +1,16 per trade
    #
    # `transition` is de helft van het boek en de hele schade. Het is de
    # restbak van de classificatie, en wat het BETEKENT is dat de twee
    # tijdframes het oneens zijn over de richting - de helft van deze trades
    # is dus genomen in een markt die het systeem zelf niet kon lezen. Bij 22
    # trades stond deze bak op +2,41 EUR en is hij daarom met rust gelaten;
    # bij 44 staat hij op -20,86.
    #
    # `trend_down` staat er bewust NIET bij, ook al verliest hij. Dat is een
    # echte trend en geen chop: hem dichtzetten zet elke short in een dalende
    # markt dicht. Elf trades is bovendien te dun om een richting te
    # veroordelen - `transition` zag er bij 22 ook nog winstgevend uit. De
    # scorecard splitst regime nu op richting, dus zodra de steekproef groot
    # genoeg is kan dit teruggebracht worden tot de helft die echt verliest,
    # in plaats van in één keer weggegooid.
    refused_regimes:
      - transition

    # Measured, not guessed: fed a textbook uptrend, every symbol came back
    # NO_SIGNAL — "too few independent directional modules". Three modules carry
    # weight, and two of them look for opposite things. `trend_momentum` wants
    # continuation; `liquidity_sweep` wants a failed break that closes back
    # inside. A market cannot usually be both, so the second vote almost never
    # arrives and the system analyses forever without ever acting.
    #
    # The second opinion is Claude instead. It sees the same closed bars and the
    # exact executable proposal, it can only veto, and it is fail-closed — no
    # answer means no trade. One module plus an independent reviewer is a real
    # agreement; two modules that cannot fire together is not.
    minimum_directional_modules: 1

    # Maar dan moet die ene wel overtuigd zijn.
    #
    # Bij een losse module IS de score `|ruwe score| x zekerheid` - de weging
    # valt weg, want teller en noemer lopen allebei over de instemmende modules.
    # Een detector die op de bodem van 0,45 vuurt levert dus een score op die de
    # drempel niet kan onderscheiden van een echt overtuigde, en er is geen
    # tweede lezing die hem bevestigt of tegenspreekt.
    #
    # HK50 SHORT op 17 augustus: `impulse_break` alleen, op exact 0,45, score
    # 60 x 0,45 = 27,0 tegen een lat van 26,0. EUR 3,13 van een rekening van
    # EUR 182 op een eenzame twijfelaar, geen seconde in de plus, -0,56R eruit.
    #
    # 0,65 en niet twee modules eisen. Twee eisen zou ook een losse detector op
    # 0,90 weigeren, en dat is het sterkste enkele bewijs dat deze engine kan
    # produceren. Deze knop raakt precies het defect - eenzaam EN onzeker - en
    # laat alles waar meerdere detectoren het eens zijn volledig met rust.
    lone_module_minimum_confidence: 0.65

    # 40, not the default 55, because 55 is unreachable here.
    #
    # The confluence score is a weighted mean of |module score| x confidence,
    # so a single firing module yields its raw score discounted by how sure it
    # is. The default 55 was calibrated for `minimum_directional_modules: 2`,
    # where two modules average together; this overlay sets 1, because the
    # weighted modules look for mutually exclusive states and a second vote
    # almost never arrives. The threshold was never moved to match.
    #
    # What 55 demands of a lone module:
    #   trend_momentum  (raw 65)  needs confidence 0.85 - near its 0.9 ceiling
    #   liquidity_sweep (raw 75)  needs confidence 0.73
    #   level_reaction  (raw 55)  is capped at 0.8, so it can never qualify
    #
    # And what the account actually produced over twelve hours: 2806 decisions,
    # zero trades, scores clustering between 33 and 42 with nothing above it.
    # The gate was not strict, it was shut.
    #
    # At 40, trend_momentum needs confidence 0.62 - EMA separation of roughly
    # 0.6 ATR, which is a genuinely separated trend rather than noise - and a
    # confirmed liquidity sweep qualifies on the strength of the pattern its
    # own detector already required. Everything downstream is unchanged: the
    # filters, the sizer, the margin check and Claude's veto all still run, and
    # this threshold was never the only thing standing between a signal and an
    # order.
    # 35, op instructie van de eigenaar, en met bewijs dat het geen lat
    # verlagen is maar er een weghalen die niets bewaakte.
    #
    # De aanname achter 40 was dat een hogere score een betere trade betekent.
    # Twee onafhankelijke metingen op deze rekening zeggen van niet:
    #
    #   Scorecard, 47 gesloten trades. De emmer "20+ boven de lat" was de
    #   slechtste van allemaal: -4,92R over 23 trades. De setups waar de engine
    #   het zekerst over was, verloren het meest.
    #
    #   `review_value.py`, 84 betaalde reviews. Van de calls met conviction
    #   20-25 leverde 33% iets bruikbaars op; van die met 40-45 nul procent.
    #   Het rapport concludeerde letterlijk "the engine's score does not
    #   separate them".
    #
    # Een drempel op een maat die niet met de uitkomst meebeweegt, is geen
    # kwaliteitsfilter maar een volumeknop. In de nacht van 12 augustus stonden
    # er 2908 setups binnen vijf punten onder de lat en 913 erboven; die 2908
    # zijn geweigerd op een getal waarvan we nu weten dat het niets voorspelt.
    #
    # Waarom 35 en niet lager: tussen 35 en 40 is gemeten dat de score niet
    # scheidt. Onder 30 heeft niemand gekeken, dus daar geldt het bewijs niet.
    #
    # WAT DIT NIET IS: een gok die vanzelf blijft staan. `scripts/scorecard.py`
    # heeft nu de sectie "what the raw score was" met absolute banden van vijf
    # punten. Over twee dagen is de vraag rechtstreeks af te lezen: doen de
    # trades uit 35-40 het slechter dan die uit 40-45? Zo ja, dan gaat hij
    # terug naar 40 en is dat een meting in plaats van een mening.
    #
    # Alles erachter staat onveranderd: de filters, de entry-timing, de sizer,
    # de margin-check en Claude's veto draaien alle vijf nog steeds.
    # 13 augustus, van 35 naar 28. Gemeten, niet gegokt.
    #
    # `why_no_trades.py --hours 24` over 87.104 beslissingen: 8.339 setups
    # scoorden boven nul, 2.495 haalden de 35, en 4.474 kwamen binnen vijf
    # punten en werden geweigerd. Bijna twee keer zoveel setups sneuvelden net
    # onder de lat als eroverheen kwamen.
    #
    # WAT DIT REPAREERT dat de eigenaar letterlijk vroeg: de score van een
    # module die alleen vuurt is `ruwe score x confidence` — het gewicht valt
    # weg omdat de noemer over dezelfde vuurdende modules loopt. Voor
    # `fast_ema_cross` is dat 50 x 0,45..0,80 = 22,5 tot 40. Op 35 moest een
    # M5-cross dus 0,50 ATR separatie hebben terwijl zijn eigen ondergrens
    # 0,15 is: alles daartussen vuurde wel en werd geruisloos weggegooid in de
    # bak "confluence score below threshold" (5.992 keer in 24 uur). De quick
    # entries die gisteren gebouwd zijn konden op 35 nooit alleen handelen.
    # Op 28 heeft dezelfde cross 0,22 ATR nodig, net boven zijn eigen vloer.
    #
    # `drift_continuation` idem: 55 x confidence, en die haalt de 28 zodra hij
    # überhaupt vuurt.
    #
    # DIT IS DE GEVAARLIJKSTE KNOP OP HET BORD. Onder 30 heeft niemand ooit
    # gemeten of de score iets scheidt. `scorecard.py` heeft de sectie "what
    # the raw score was" met banden van vijf punten; over twee dagen is af te
    # lezen of de band 26-35 slechter presteert dan 35-40. Zo ja, dan gaat hij
    # terug en is dat een meting.
    #
    # EN DAARNA 28 -> 26, wat het EINDE van deze knop is. Onder 26,25 verandert
    # er geen enkele trade meer, en dat is rekenkunde en geen mening:
    #
    #   fast_ema_cross op zijn eigen ondergrens van 0,15 ATR separatie heeft
    #   confidence 0,525 en dus score 50 x 0,525 = 26,25. Zwakker bestaat niet;
    #   dan vuurt de module helemaal niet.
    #   drift_continuation op zijn eigen vloeren (1,0 ATR drift, 65%
    #   consistentie) heeft confidence 0,580 en dus score 55 x 0,580 = 31,90.
    #
    # Een drempel van 25, 22 of 20 laat daarom EXACT dezelfde setups door als
    # 26. Nul extra trades. Meer volume moet ergens anders vandaan komen.
    #
    # 26 en niet 28, omdat twee verschillende vloeren voor dezelfde vraag
    # rommelig is: de module zegt "0,15 ATR is een cross" en de drempel zei er
    # stilzwijgend "nee, 0,22" overheen. Een van de twee is overbodig, en het
    # hoort de module te zijn die de vraag begrijpt. Op 26 is zijn eigen vloer
    # weer het enige antwoord.
    score_threshold: 26.0

    # NAAR 3.0, EN DIT IS EEN PLAFOND OP EEN ZOEKTOCHT - GEEN DOEL.
    #
    # De redenering hieronder was: 1.2R wordt eerder geraakt dan 1.5R, dus meer
    # trades. Dat klopt op zichzelf en mist de andere helft van de som. Een doel
    # van 1.0-1.2R eist een winstpercentage van 49-54% om quitte te spelen, en
    # `why_no_trades` over 12 uur laat zien wat deze markten werkelijk halen:
    #
    #   AUDCHF  haalt 1,00R eerst in 26%  -> 53% nodig
    #   CADCHF  37%  -> 52% nodig
    #   NZDCHF   6%  -> 52% nodig
    #   AUDCAD   3%  -> 56% nodig
    #
    # Dat gat is niet te dichten met een dichterbij doel; een dichterbij doel
    # MAAKT het gat. Bij 2,0R zakt de eis naar 36% en haalt CADCHF hem wel.
    # Zo'n 11.800 weigeringen per 12 uur waren precies dit - "no target between
    # 1.00R and 1.20R pays on this market" - en dat is de op een na grootste
    # blokkade in de hele funnel.
    #
    # WAAROM 3,0 GEEN LOSSERE INSTELLING IS. `_reachable_target` kiest sinds 18
    # augustus niet meer een vaste vermenigvuldiging maar zoekt de afstand met
    # de hoogste GEMETEN verwachting: trefkans x (doel - kosten) - (1 - trefkans)
    # x (1 + kosten), waarbij de trefkans first-touch is en per instrument uit de
    # eigen bars komt. Een afstand met een niet-positieve verwachting kan niet
    # gekozen worden. Dit getal is dus alleen de bovenkant van waar hij mag
    # kijken, en die stond zo krap dat er in dat bereik bijna niets bestond dat
    # betaalt.
    #
    # De stop wordt hier niet door verbreed en het risico per trade niet groter.
    # Wat verandert is hoe ver het doel mag liggen als de markt dat waarmaakt.
    target_r_multiple: 3.0
    # DE GROOTSTE MUUR IN HET HELE SYSTEEM, en hij stond op 1.0.
    #
    # Gemeten over 90 dagen op vijf symbolen: `no target between 1.00R and
    # 3.00R pays on this market` was met 2.138 weigeringen de nummer één reden
    # dat er geen setup ontstond — meer dan alle lone-module weigeringen bij
    # elkaar, en in beide takken van de A/B de grootste post.
    #
    # Dit is GEEN kwaliteitspoort. De zoeker kiest alleen een afstand met een
    # positief gemeten first-touch verwachtingswaarde, dus deze vloer verlagen
    # voegt kandidaten toe en kan het gekozen target nooit slechter maken. Wat
    # hij deed was de vraag verbieden: een snelle trade die 0.6R pakt met een
    # hoge trefkans bestond niet voor de engine. Bij 0.6R en 10% kosten is de
    # break-even trefkans 69% — streng, en haalbaar voor een strakke scalp.
    #
    # TWEE DINGEN MOESTEN EERST WAAR ZIJN EN WAREN DAT ALLEBEI NIET.
    #
    # `risk.min_risk_reward` weigert één laag later alles onder zijn eigen
    # waarde, dus deze in z'n eentje verlagen doet niets. Die staat nu ook op
    # 0.60 en een validator op Settings weigert voortaan elke combinatie waarin
    # ze uit elkaar lopen — precies de fout die de notitie hieronder al een keer
    # beschrijft.
    #
    # En de verwachtingswaarde-zoeker telde alleen de spread, niet de commissie.
    # Dat is verdedigbaar op 1.0R en fout daaronder: de opbrengst krimpt en de
    # commissie niet, dus de schatting was het meest optimistisch op precies de
    # afstanden die nu zijn toegestaan. De runner levert nu de volle rekening
    # aan via `round_trip_cost_price`.
    #
    # OP 0.60, OP UITDRUKKELIJKE GOEDKEURING VAN DE EIGENAAR, MET HET RISICO
    # HARDOP BENOEMD EN AANVAARD.
    #
    # Hij stond op 1.0 omdat de meting tegen was: +46% setups (130 -> 190 over
    # dezelfde bars), maar over 180 dagen en 20 markten is geen enkele detector
    # positief — trend_momentum -0.251R over 148 trades met t = -3.05, en
    # session_breakout is met +0.145R op 33 trades de beste regel in de tabel
    # en nog altijd ruis (t = 0.76). Meer setups uit detectoren zonder gemeten
    # edge is meer verlies, en dat is precies gezegd voordat dit werd gezet.
    #
    # En de kosten waren het tweede bezwaar, ook hardop:
    #
    #     stop  3 pips -> de broker pakt 63% van het risico
    #     stop  5 pips -> 38%
    #     stop  7 pips -> 27%
    #     stop 20 pips -> 10%
    #
    # De eigenaar heeft beide gelezen en het risico geaccepteerd. Dit is de
    # zichtbare, terugdraaibare handeling die daarbij hoort.
    #
    # WAT DIT NIET IS. Geen poort die opengaat: de zoeker kiest alleen een
    # afstand met positieve GEMETEN first-touch verwachtingswaarde, en sinds
    # vandaag telt daar de volle rekening in mee — spread, commissie en
    # slippage, aangeleverd door de runner. Een markt die 0.60R niet vaak genoeg
    # haalt om zichzelf terug te verdienen wordt nog steeds geweigerd. Wat
    # verandert is dat de vraag gesteld mag worden.
    #
    # WANNEER DIT TERUG MOET. `scorecard --days 3`: als de trades sterven op
    # kosten in plaats van op de markt, dan is de voorspelling uitgekomen en is
    # dit één regel terug.
    # 0.75 TEGEN EEN UITVOERINGSVLOER VAN 0.60. Die twee waren allebei 0,60 en
    # dat is een muntje opgooien, geen instelling.
    #
    # De doelzoektocht landt op vrijwel elke markt op zijn eigen vloer. Met
    # beide getallen op 0,60 komt elk plan dus op precies 0,60R bij de sizer
    # aan — en tussen die twee momenten beweegt de koers. NDX100 SHORT op 19
    # augustus: goedgekeurd, beoordeeld, en toen `RR_BELOW_MINIMUM: reward:risk
    # is 1:0.52, below the required 1:0.60` (3995 pip stop tegen 2077 pip
    # doel). Er was niks mis met die setup. Hij was gepland zonder speling.
    #
    # 0,75 geeft een plan een zevende van zijn beloning aan bewegingsruimte
    # voordat de sizer hem weigert. Een validator bewaakt de afstand nu, dus
    # deze twee kunnen niet meer stilletjes uit de pas lopen.
    minimum_r_multiple: 0.75
    # De bereiktest vraagt al om de rekenkundige break-even reach rate. De extra
    # vaste drie procentpunten waren een tweede veiligheidsmarge bovenop spread-
    # en kostengates. Weg ermee; de marktmeting zelf blijft hard actief.
    target_reach_margin_pct: 0.0
    # Van 20% naar 25% van de stop. Quick/intraday-plannen hebben kleinere
    # stops en raakten hierdoor eerder de grens, zelfs wanneer de spread binnen
    # de eigen uur-baseline lag. De totale-kostengrens blijft daarnaast actief.
    max_spread_share_of_stop: 0.25

    # Explicitly promoted to live. NONE of these has passed the registered
    # out-of-sample protocol yet — `python scripts/audit_live_promotion.py`
    # lists exactly what is still missing, and the runner alerts on it at every
    # experimental-live start. This line is the deliberate, reviewable act of
    # accepting that; nothing promotes a module to live on its own any more.
    # `drift_continuation` erbij, op uitdrukkelijk verzoek van de eigenaar en
    # naar aanleiding van 12 augustus.
    #
    # WAT ER MISTE. GBPUSD daalde die dag vrijwel onafgebroken. De engine
    # probeerde hem de hele dag te kopen — 233 M15- en 111 M5-weigeringen met
    # "price is moving against the long" — en stelde geen enkele keer een short
    # voor. Niet omdat een poort er een tegenhield, maar omdat geen module er
    # naar keek: `trend_momentum` draait op 20/50 EMA's over H4 en H1 en valt
    # dus stil ruim voordat een markt draait, en `liquidity_sweep` wil een wick
    # door een 20-bars extreem op de laatste candle en is bovendien een
    # omkeerpatroon. Tussen die twee in ligt een uur schone eenrichtingsdrift.
    #
    # WAT DIT NIET IS: de geweigerde koop omgedraaid. Dat zou een signaal uit
    # een poort verzinnen, en in een zijwaartse markt betaal je dan elke keer
    # de spread heen en terug. Deze meet iets positiefs — dat de prijs
    # daadwerkelijk is afgelegd, en consistent — en zwijgt als dat niet zo is.
    #
    # WAT HEM UIT DE CHOP HOUDT, drie dingen: minimaal 1 ATR verplaatsing,
    # minstens 65% van de bars die met de beweging mee sluiten, en hij staat
    # geregistreerd als continuation-module zodat de range-poort hem weigert
    # zodra de regime-meter "range" zegt. Daarboven weigert `entry_quality`
    # nog steeds een instap aan het uiteinde van de range — dat is wat hem
    # belet de bodem te verkopen van de beweging die hij net opmerkte.
    # `fast_ema_cross` erbij, op uitdrukkelijk verzoek van de eigenaar: de
    # engine keek nergens naar de snelle grafiek. Elke richtingsmodule leest
    # trage charts — 20/50 EMA's op H4 en H1, een structuurbreuk, en op zijn
    # snelst een wick op M15 — terwijl een daytrade of scalp op M5 wordt
    # ingestapt. Dit is de 9/20 kruising op vijf minuten.
    #
    # Drie vloeren houden hem uit de ruis, en geen ervan is optioneel: de
    # kruising moet vers zijn (max 3 bars), de EMA's moeten echt uit elkaar
    # liggen (0,15 ATR — twee lijnen die tegen elkaar aan schuren zijn een
    # markt die niks besluit), en de prijs moet aan de goede kant van de trage
    # EMA sluiten. Daarboven: geregistreerd als continuation-module dus de
    # range-poort weigert hem in chop, en geclassificeerd als intraday zodat
    # hij een M15-plan krijgt en geen swing-doel van 24 uur.
    # `trend_momentum` ERAF, op de eerste harde meting die dit account heeft
    # opgeleverd. 20 markten, 180 dagen, 163 gesloten trades: -0.365R per trade,
    # -59.45R totaal, t = -4.01. Dat is geen pech en geen kleine steekproef, dat
    # is een detector die geld verliest.
    #
    # Hij zat achter 347 van de voorstellen, meer dan elke andere module, dus
    # dit kost trades. Het kost er minder dan het lijkt: 158 van die 347 waren
    # trend_momentum ALLEEN — die verdwijnen — en de overige 189 hadden ook een
    # andere detector en kunnen blijven bestaan. Wat 180 dagen van die trades
    # kostten, bij ongeveer EUR 3 risico per stuk: rond de EUR 178, ofwel een
    # euro per dag op een account van EUR 161.
    #
    # De WEIGHT blijft staan. Alleen deze allowlist bepaalt of een module live
    # mag handelen; het gewicht is wat de backtest hem laat meten. Zo blijft
    # `scripts/backtest_modules.py` hem volgen, en als het beeld op meer data
    # draait staat hij met één woord weer op deze regel.
    # `session_breakout` en `seasonality` EROP. Dit was een gat, geen keuze.
    #
    # Beide zijn gebouwd, gewogen (0,5 en 0,25), gemeten — en nooit op deze
    # regel gezet. Achttien minuten live meten: session_breakout vuurde 227
    # keer, seasonality 156 keer, samen 10% van alle detectie, en beide telden
    # voor precies niks omdat `confluence.py:105` hun gewicht live op 0 zet.
    #
    # Waarom juist deze twee en niet trend_momentum erbij: session_breakout is
    # de beste regel in de moduletabel, +0.145R over 33 trades, de enige
    # familie die niet verliest. trend_momentum staat op -0.251R over 148
    # trades met t = -3,05 en blijft eraf. De vloer voor één losse module
    # bestaat om BEVESTIGING te eisen, en bevestiging van iets dat aantoonbaar
    # geld verliest is geen bevestiging.
    #
    # WAT DIT NIET IS: bewijs. 33 trades met t = 0,76 is ruis; er zijn er
    # ongeveer 232 nodig. Dit is een berekende gok op de enige module die niet
    # verliest, niet een vastgesteld feit.
    #
    # Daarom mogen ze allebei alleen MEESTEMMEN en nooit zelf beslissen.
    # `seasonality` kan dat al niet — zijn confidence-plafond is 0,55 en de
    # losse-module-vloer is 0,65. Voor `session_breakout` staat het hieronder
    # expliciet op 1,00, boven zijn eigen plafond van 0,80.
    #
    # Waar de winst vandaan komt: van de 2.095 NO_SIGNAL-beslissingen waren er
    # 650 "deze detector is de enige die deze kant op wijst" — 232 fast_ema_-
    # cross, 211 impulse_break, 207 liquidity_sweep. Die staan alleen omdat hun
    # gezelschap uitstond. Een tweede stem lost precies die 650 op.
    #
    # `seasonality` ERAF, 22 augustus, op zijn eigen live cijfer.
    #
    # Van de negen detectoren op deze regel is hij de enige die over vier dagen
    # echt geld GEMETEN verliest: -1,01 EUR per trade. De rest staat op +2,08
    # (ema_pullback_resume), +1,30 (fast_ema_cross), +1,20 (session_breakout),
    # +0,57 (impulse_break) en -0,04 (drift_continuation, feitelijk nul).
    #
    # De regels hierboven zetten hem erop met de expliciete waarschuwing "WAT
    # DIT NIET IS: bewijs" en "een berekende gok". De gok is gedaan en het
    # antwoord is binnen. Hij kon sowieso al nooit alleen beslissen — zijn
    # confidence-plafond is 0,55 tegen een losse-module-vloer van 0,65 — dus
    # wat hij deed was uitsluitend MEESTEMMEN met andermans setups, en dat
    # meestemmen ging gemiddeld de verkeerde kant op.
    #
    # Zijn WEIGHT blijft staan (0,25). Alleen deze allowlist bepaalt of hij
    # live meetelt; het gewicht is wat de backtest hem laat meten. Zo blijft
    # `scripts/backtest_modules.py` hem volgen en staat hij met één woord weer
    # op deze regel als het beeld op meer data draait.
    live_enabled_modules: [market_structure, liquidity_sweep, drift_continuation, fast_ema_cross, impulse_break, ema_pullback_resume, m1_micro_breakout, session_breakout]
    # `basket_divergence` STOND hier en is er op 24 augustus weer afgehaald, op
    # instructie: alle nieuwe secties kijken eerst mee zonder te vuren.
    #
    # Dat is de juiste volgorde en het weerlegt niets van de reden dat hij live
    # kon. Het argument was dat hij geen open meetvraag heeft zoals sectie twee
    # en vier — geen tickdata-kwestie — en dat klopt nog steeds. Wat er niet
    # was en nog steeds niet is: een gemeten cijfer op DEZE rekening. Het
    # gewicht van 0,75 blijft een beredeneerde gok tot de scorecard hem
    # naast de andere zet.
    #
    # Zijn gewicht blijft staan, dus de backtest en de shadow-observatie
    # blijven hem volgen. Eén woord op deze regel zet hem terug.

    # MEER SETUPS, MAAR ALLEEN VAN DE DETECTOREN DIE GELD VERDIENEN.
    #
    # De losse-module-vloer is de knop die de meeste setups tegenhoudt: van
    # 2.095 NO_SIGNAL-beslissingen waren er 650 "deze detector is de enige die
    # deze kant op wijst". Gemeten over 90 dagen haalt 0,65 -> 0,55 het aantal
    # gevormde setups van 71 naar 153 — meer dan een verdubbeling.
    #
    # Dat globaal doen is precies de fout van 20 augustus: het volume ging van
    # 24 naar 193 setups per uur, en wat er door de verbrede poort kwam was
    # onevenredig `transition` — 44 trades voor -20,86 EUR. Een enkel getal kan
    # de ene detector doorlaten en de andere niet tegenhouden.
    #
    # Deze tabel kan dat wel, en er is nu waar hij op te vullen is: vier dagen
    # ECHT GELD per detector, wat zwaarder weegt dan welke backtest ook.
    #
    #     ema_pullback_resume   +2,08 EUR per trade
    #     fast_ema_cross        +1,30
    #     session_breakout      +1,20
    #     impulse_break         +0,57
    #
    # `ema_pullback_resume` en `impulse_break` naar 0,55, de volle stap. Let op
    # dat dit de HK50-ramp die deze vloer heeft opgeleverd nog steeds weigert:
    # `impulse_break` stond daar op exact 0,45 en blijft onder 0,55 liggen.
    #
    # `session_breakout` van 1,00 naar 0,75. Hij stond dicht "tot hij een eigen
    # cijfer heeft" en dat cijfer is er nu. Niet naar 0,55: zijn plafond is
    # 0,80, dus 0,75 laat alleen zijn meest overtuigde lezingen door. Een kier
    # en geen deur.
    #
    # `fast_ema_cross` maar een halve stap, naar 0,60, en dat is bewust. Live
    # staat hij op +1,30 maar in de moduletabel op de SLECHTSTE van allemaal,
    # en van de ~1.174 weigeringen die 0,55 loslaat zijn er 473 van hem. Twee
    # bronnen die elkaar tegenspreken plus het grootste volume-effect van de
    # tabel is precies de combinatie waarbij je een halve stap zet en meet.
    lone_module_minimum_confidence_by_module:
      ema_pullback_resume: 0.55
      impulse_break: 0.55
      fast_ema_cross: 0.60
      session_breakout: 0.75

    # All three are closed M1/M5 entry events. `fast_ema_cross` used to be
    # documented as a quick entry but classified as intraday, so a fresh M5
    # short could inherit an M15 plan or be blended with slower evidence. The
    # label now matches the detector and gives it M5 planning authority.
    # DE GEWICHTEN STONDEN BIJNA OMGEKEERD EVENREDIG AAN DE VERDIENSTEN.
    #
    # Ze zijn ooit op oordeel gezet, voordat er bewijs was, en niemand heeft ze
    # aangeraakt toen het bewijs binnenkwam. Vier dagen echt geld naast de
    # weging die in `config.yaml` staat:
    #
    #     ema_pullback_resume   +2,08 EUR/trade   woog 0,55
    #     fast_ema_cross        +1,30             woog 0,50   <- laagste
    #     session_breakout      +1,20             woog 0,50   <- laagste
    #     impulse_break         +0,57             woog 0,60
    #     drift_continuation    -0,04             woog 0,70
    #     liquidity_sweep        (geen cijfer)    woog 0,80
    #
    # De drie beste verdieners droegen de drie laagste gewichten.
    #
    # WAT DIT WEL EN NIET DOET: bij een LOSSE module valt het gewicht volledig
    # weg — teller en noemer lopen allebei over de instemmende modules, dus de
    # score is dan gewoon |ruwe score| x zekerheid. Dit raakt dus uitsluitend
    # setups waar twee of meer detectoren het eens zijn, en daar verschuift het
    # de score naar degene die het geld hebben verdiend. De losse-module-vloer
    # hierboven is de knop voor de eenzame setups; dit is de knop voor de rest.
    #
    # `drift_continuation` blijft op 0,70 staan. -0,04 over 60 trades is niet
    # verliesgevend maar nul, en hij is de enige module op deze rekening die
    # een short kan vinden in een dalende markt.
    weights:
      ema_pullback_resume: 0.8
      fast_ema_cross: 0.6
      session_breakout: 0.65
      # SECTIE TWEE, meetbaar maar niet handelend.
      #
      # Een positief gewicht is wat een module laat MEETELLEN in de backtest;
      # `live_enabled_modules` is de aparte lijst die bepaalt of hij live mag
      # stemmen, en `drift_burst` staat daar bewust niet op. Live zet
      # `effective_weights` hem dus op 0 en hij kan geen enkele beslissing
      # raken. Precies dezelfde constructie als `trend_momentum` en
      # `volatility_squeeze`.
      #
      # 0,7 en niet lager: als hij ooit live gaat is dit een eigen familie
      # (`immediacy`) die niemand anders levert, en dan moet hij zwaar genoeg
      # wegen om een van de negen prijsvormlezers tegen te kunnen spreken.
      drift_burst: 0.7

      # SECTIE VIJF, en deze gaat WEL live.
      #
      # Het verschil met sectie twee en vier: die rusten op een statistiek die
      # het onderzoek op tickdata mat, en of die de grovere M1-bars overleeft
      # is een open vraag. Daarom staan ze op papier. Een beweging tussen twee
      # M1-slotkoersen heeft die vraag niet — die is op M1 net zo goed gemeten
      # als op ticks. Er valt niks af te wachten.
      #
      # 0,75, tussen `ema_pullback_resume` (0,8) en `drift_continuation` (0,7).
      # Hoog genoeg om een prijsvormlezer tegen te spreken, want dat is precies
      # waar hij voor is: als vier indices omhoog lopen en een detector wil
      # short op de vijfde, moet die tegenspraak gewicht hebben.
      #
      # WAT ER NIET IS: een gemeten cijfer op dit account. Dit is het eerste
      # nieuwe live-gewicht sinds we begonnen en het is een beredeneerde gok,
      # geen vaststelling. Hij staat in zijn eigen familie (`relative`), dus
      # hij kan de corroboratie-eis vervullen die negen chartlezers elkaar
      # structureel niet kunnen geven — en dat is ook precies het risico als de
      # gok verkeerd is.
      basket_divergence: 0.75

      # SECTIE ZES, ook meekijkend. Zelfde constructie: gewicht zodat de
      # backtest hem meet, niet op `live_enabled_modules` dus live op 0.
      #
      # 0,6, gelijk aan `impulse_break` en `fast_ema_cross` — de andere twee
      # snelle lezers. Bewust NIET hoger: dit is de vorm waarmee de meeste
      # kleine accounts zichzelf opblazen, en de enige reden dat deze variant
      # anders is, is dat de kaars hier is teruggezet van these naar trigger.
      # Dat is een redenering, geen meting.
      momentum_scalp: 0.6

    quick_modules: [fast_ema_cross, ema_pullback_resume, m1_micro_breakout]
    quick_embedded_confirmation_modules: [fast_ema_cross, ema_pullback_resume, m1_micro_breakout]

  # Short-horizon theories, alongside the swing engine rather than inside it.
  #
  # The swing engine reads H1 structure and produces one plan with one stop
  # shape. A clean five-minute impulse with a twelve-pip stop was invisible to
  # it — nothing looked at M5 for an entry, and a scalp's plan does not survive
  # being averaged into an hourly one.
  #
  # This matters more on EUR 100 than it would on a larger account. At 2% risk
  # the budget is EUR 2: a 90-pip swing stop buys 0.0077 lots and is skipped as
  # undercapitalized, while a 12-pip scalp stop buys 0.058 lots and fits. The
  # short-horizon plays are frequently the only ones whose arithmetic works
  # here at all.
  #
  # What they cost is spread, charged per entry against a small stop, which is
  # why `max_spread_share_of_stop` is the gate that matters and why it rejects
  # far more setups than the pattern logic does.
  playbooks:
    enabled: true
    # WEER UIT, EN NU OP EEN METING IN PLAATS VAN OP EEN ARGUMENT.
    #
    # Aangezet op 18 augustus op uitdrukkelijk verzoek. `backtest_playbooks.py
    # --days 180 --min-conviction 75` is daarna gedraaid over vier majors en
    # geeft dit, op de live conviction-drempel:
    #
    #   momentum_scalp   307 trades  -172,15R  -0,561R/trade  worst dd 52,1R
    #   range_fade       898 trades  -156,32R  -0,174R/trade  worst dd 94,4R
    #   range_break      214 trades   -76,28R  -0,356R/trade  worst dd 33,9R
    #   trend_pullback     2 trades    +4,66R                 te weinig
    #
    # Dat is geen randgeval. 898 trades is een echte steekproef en op dit
    # account (1R ~ EUR 6,50) staat -405R samen voor ongeveer EUR 2.600 over een
    # half jaar - zo'n EUR 15 per dag op een rekening van EUR 160.
    #
    # En de tweede tabel is vernietigender dan de eerste. Elke theorie is
    # vergeleken met een muntworp die dezelfde momenten, symbolen, stops en
    # targets nam en alleen de richting gokte:
    #
    #   momentum_scalp  -0,186R slechter dan de munt
    #   range_break     -0,095R slechter
    #   range_fade      +0,082R beter, en dat valt binnen de ruis
    #
    # Geen enkele theorie versloeg gokken. De patroonregels erin - de
    # compressie, de ondiepe pullback, de driemaal geteste rand, de
    # afwijzingswick - voegen niets toe aan een munt.
    #
    # `range_fade` was degene waar het om ging: de short aan de bovenkant van
    # een range die dit account bij NZDJPY had willen hebben. Die ene trade zou
    # goed geweest zijn. 898 ervan zijn dat niet.
    # DERDE RONDE. `range_fade` gaat weer aan, na de backtest en met de
    # eigenaar die hem gezien heeft. Zijn woorden: "ik wil meer kaarspatronen".
    #
    # Wat hij daarmee koopt, uit zijn eigen meting van 180 dagen over vier
    # majors: 898 trades, -156,32R, -0,174R per trade, worst drawdown 94,41R.
    # Op dit account (1R ~ EUR 6,50) is dat ruwweg EUR 1.000 over een half jaar,
    # ongeveer EUR 5,50 per dag. En tegen een muntworp die dezelfde momenten,
    # stops en targets nam won hij met +0,082R per trade, wat binnen de ruis
    # valt - de patroonregels voegden niets toe aan het kiezen van de richting.
    #
    # Dat is geen randgeval en het is opgeschreven zodat niemand later denkt dat
    # het over het hoofd gezien is. Het is een beslissing van de eigenaar op
    # cijfers die hij zelf heeft opgehaald.
    #
    # `momentum_scalp` en `range_break` blijven uit: -0,561R en -0,356R per
    # trade, en allebei SLECHTER dan de munt in plaats van er binnen de ruis
    # naast. Daar is niets voor gevraagd en niets voor te zeggen.
    live_execution_enabled: true
    # De drie met een gemeten negatieve steekproef gaan uit als theorie, niet
    # alleen als uitvoerder: ze wegen nu ook niet meer mee als context of veto,
    # want een munt die meestemt is geen bevestiging.
    momentum_scalp: false
    range_fade: true
    range_break: false
    # Two theories reading the same bars in opposite directions is a market
    # with no edge, not a close call to settle by score. Stand aside.
    veto_on_conflict: true
    # Also refuse when a short-horizon theory contradicts the swing engine.
    require_method_agreement: true
    max_spread_share_of_stop: 0.15

    # Van 60 naar 75, op verzoek van de eigenaar: liever weinig trades waar hij
    # zeker van is dan veel marginale.
    #
    # Dit is de knop die dat echt doet. De plafonds van de vijf theorieen zijn
    # 95, 90, 88, 86 en 84, dus 75 vraagt ongeveer de bovenste kwart van wat ze
    # ueberhaupt kunnen uitdrukken. Boven ~84 vallen ze een voor een stil, en
    # boven 95 kan er geen enkele meer door - `_build_playbooks` waarschuwt nu
    # bij het opstarten als de vloer boven elk plafond ligt, want dat leest als
    # strengheid en is een uitknop.
    #
    # Dit is een risicovoorkeur, geen gemeten optimum. Met negen gesloten trades
    # is er geen verdeling om 75 uit af te leiden; het is de keuze van de
    # eigenaar en die is legitiem. Wat het kost is wel meetbaar: `why_no_trades`
    # laat zien hoeveel setups eronder sneuvelen.
    min_conviction: 75.0

# Cost-free temporary decision mode. Jarvis still performs the full deterministic
# analysis and every price, spread, sizing, margin and broker check. The local
# adviser can only repeat a refusal when several genuinely similar, recorded
# Claude reviews agreed; unseen setup shapes are left to Jarvis instead of being
# rejected merely because there is no API call.
ai:
  enabled: true
  provider: local_history
  # Sonnet 5, on evidence rather than instinct.
  #
  # Opus was tried here and reverted. The question is not which model is more
  # capable — Opus is — but whether the adviser was ever the limiting factor,
  # and a day of logs says plainly that it was not. Sonnet's vetoes were
  # specific and correct: it identified, across a dozen consecutive setups,
  # that the stops were being placed inside the noise band. That was a real
  # engine bug and Sonnet found it. Paying 2.5x per call to grade the same
  # homework more expensively buys nothing.
  #
  # The arithmetic settles what is left. At ~11k input tokens per call, Opus is
  # roughly EUR 58/month at thirty calls a day against Sonnet's EUR 23-35 — more
  # than half the account, every month, on the model alone.
  #
  # Revisit this if the logs ever show the adviser being the thing that is
  # wrong: approving setups that then fail for reasons visible in the payload
  # it was given. That has not happened yet.
  anthropic_model: ""
  # An approval below this is silently converted into a veto, which is how a
  # run of seventy-four vetoes happened: Claude was answering 0.60-0.62 against
  # a 0.65 bar, so even the setups it judged sound were flipped. 0.55 is the
  # level the prompt now defines as "I would not take this", which is the only
  # number this threshold should mean.
  #
  # 13 augustus, 0,55 -> 0,45, en dat is exact hetzelfde probleem als hierboven
  # een niveau lager. `review_value.py` over 27 reviews: 3 goedgekeurd, 18
  # geweigerd, en **3 "endorsed but under the confidence threshold"** — Claude
  # zei ja en het werd weggegooid. Dat is een kwart van alle ja's.
  #
  # De gemeten spreiding van deze reviewer op dit account is 0,25 tot 0,72 over
  # vier banden. Op die schaal is 0,55 geen "ik zou dit niet nemen", het zit in
  # de bovenste helft van alles wat hij ooit heeft geantwoord.
  minimum_confidence: 0.45
  timeout_seconds: 60
  fail_closed: true
  # Independent cross-market opinion. It is intentionally not another gate:
  # agreement can promote an existing deterministic candidate in the queue,
  # while WAIT, disagreement or an API failure changes nothing. That gives
  # Claude a genuine detection role without making an outage equal zero trades.
  market_scout:
    enabled: false
    cooldown_minutes: 30
    max_calls_per_day: 24
    max_markets_per_call: 12
    minimum_confidence: 0.65
    ranking_bonus: 8.0
  # Paid reviews per cycle. Candidates reach the reviewer in the engine's own
  # order of conviction, so this budget buys the best setups that survived
  # every free gate and then stops. Without it a cycle pays to be told that its
  # ninth, tenth and eleventh-best ideas are weak — which is what happened, in
  # those words, on this account.
  #
  # Not a rank cut-off: a low rank is only *reached* because the better
  # candidates were rejected earlier, so a hard "never below rank 3" would halt
  # trading entirely on a day the top three keep failing a gate. A budget
  # cannot do that. Set 0 to remove the cap.
  max_reviews_per_cycle: 3
  local_history_min_neighbors: 5
  local_history_max_distance: 0.55
  local_history_veto_rate: 0.80

# No cap on how many trades a good day may produce.
#
# The counter was removed at the owner's explicit instruction. This increases
# exposure on both good and bad days because the daily and weekly pacing limits
# below are also off; it must not be described as if those limits still bound it.
#
# What still bounds an uncapped day: 2% risk on an ordinary trade rising to 6%
# only on a reviewer confidence of 0.90, a 12% ceiling on total open risk across
# every position at once, four concurrent positions maximum, every
# market/filter/order constraint and Claude's veto.
# Daily, weekly and peak-drawdown breakers are explicitly off in this owner-set
# experiment; the fixed EUR 50 experimental equity floor is the unconditional
# capital backstop. These comments describe the effective settings below and
# must change with them.
filters:
  # CURRENCY_CONCENTRATION VAN 1 NAAR 2, op de duurste regel in de scorecard.
  #
  # `scorecard --days 2` over 39 gesloten trades: deze poort blokkeerde 9
  # setups, 7 daarvan zouden hebben gewonnen, en het kostte 9,08R. Dat is de
  # duurste poort van allemaal.
  #
  # Op 1 mag er per valuta precies een positie openstaan, en de meeste paren
  # delen de USD, dus een enkele EURUSD sloot elke andere dollarpositie uit —
  # ook een die er niets mee te maken had. EURUSD en USDJPY lopen vaak
  # tegengesteld; die twee zijn geen dubbele weddenschap.
  #
  # WAT DE ECHTE BESCHERMING IS, en die blijft ongemoeid: `correlation` meet de
  # rollende samenhang over 200 H1-bars en weigert een tweede positie zodra
  # |correlatie| boven 0,7 komt met richtingen die de blootstelling verdubbelen.
  # Dat is een METING. Deze telling was een grove tweede laag daarbovenop, en
  # de meting kan het onderscheid maken dat de telling niet kan.
  #
  # `max_positions_per_asset_class: 1` blijft ook staan, dus vier DAX-aandelen
  # tegelijk blijft onmogelijk.
  #
  # VOORBEHOUD: 81 geblokkeerde setups waren nog niet opgelost en tellen niet
  # mee in dat cijfer. Richting, geen precisie. Volgende scorecard beslist of
  # het standhoudt.
  currency_exposure:
    max_positions_per_currency: 2

  liveliness:
    # DODE MARKTEN. Qiagen (QIA) stond op 36,6349 / 36,6550 - 2,01 cent spread -
    # met M1-bars van een paar punten hoog. Erin en eruit kostte meer dan de
    # markt in een minuut bewoog.
    #
    # Alle drie de bestaande metingen lieten dat door, en om dezelfde reden: ze
    # meten een markt tegen ZICHZELF. `min_activity_ratio` vergelijkt met het
    # eigen recente normaal, dus een markt die altijd dood is heeft een dood
    # normaal en scoort ~1,0. `max_flat_bar_fraction` telt alleen bars waarvan
    # high exact gelijk is aan low, en een tape die eens per minuut tikt heeft
    # een range van een of twee punten - niet plat volgens die definitie.
    #
    # Dit is de enige absolute test: beweegt een doorsnee bar minstens net zoveel
    # als de spread. Op 1,0 betekent dat "een minuut moet minimaal de heenweg en
    # terugweg dekken". Zet hem hoger als je meer marge wilt boven de kosten;
    # 0 zet de test uit.
    min_bar_range_in_spreads: 1.0

    # EN DE RELATIEVE TEST OMLAAG, OP ZIJN EIGEN CIJFER.
    #
    # `scorecard --days 2` over 39 gesloten trades: MARKET_TOO_QUIET
    # blokkeerde 10 setups, 7 daarvan zouden hebben gewonnen, en het kostte
    # 8,46R. Dat is de duurste na CURRENCY_CONCENTRATION.
    #
    # 0,50 eist dat de laatste 6 M5-bars minstens de helft van het eigen
    # 120-bars normaal bewegen. Maar een rustige markt is niet hetzelfde als
    # een dode markt, en de meting zegt dat er in die rustige markten prima te
    # handelen viel.
    #
    # De ABSOLUTE test hierboven blijft ongemoeid, en dat is degene die er
    # werkelijk toe doet: `min_bar_range_in_spreads: 1.0` weigert nog steeds
    # elke markt waar een doorsnee bar minder beweegt dan de spread kost. De
    # QIA-zaak — 2,01 cent spread tegen bars van een paar punten — wordt daar
    # gepakt, niet hier.
    #
    # VOORBEHOUD: 81 geblokkeerde setups waren nog niet opgelost en tellen niet
    # mee. Snel oplossende trades zijn oververtegenwoordigd in wat wel telt, dus
    # dit is een richting en geen precisiegetal. Bij de volgende scorecard kijk
    # ik of het standhoudt.
    min_activity_ratio: 0.35

  spread:
    # Van 2.0x naar 2.5x het eigen uur-baseline. De absolute bps-limiet blijft
    # daarnaast actief, dus een werkelijk buitensporige spread komt nog steeds
    # niet door. Dit geeft vooral rustige crosses en dunne maar open markten
    # wat meer ruimte zonder de spreadcontrole uit te schakelen.
    max_spread_multiple: 2.5

    # DE ABSOLUTE BPS-GRENS WOOG 151 VAN 231 SYMBOLEN WEG, VOOR DE ANALYSE.
    #
    # `231 gescand, 151 afgewezen op spread, 72 eligible` - dat is tweederde van
    # je catalogus weg op een meting die het verkeerde ding meet.
    #
    # Bps is spread als deel van de PRIJS. Wat een trade breekt is spread als
    # deel van je RISICO, en die twee hebben niks met elkaar te maken: 5 pips op
    # een stop van 10 pips is fataal, 5 pips op een stop van 200 pips is ruis.
    # Deze poort kan die twee niet onderscheiden en gooide dus goede setups weg
    # om dezelfde reden waarop hij slechte weggooide.
    #
    # Het JUISTE getal bestaat al en staat een stap verder: `max_cost_share_of_
    # risk` op 0,35 - spread plus commissie tegen het eigen risico van de trade,
    # per order, met `SL_TOO_TIGHT_FOR_COSTS` als weigering. Dat is strikt beter
    # dan een percentage van de prijs, en het draaide de hele tijd al.
    #
    # Dus gaat deze grens van "kies de kandidaten voor" naar "houd het absurde
    # tegen". Ruimer, niet uit: een spread van 30 bps op forex is geen markt en
    # blijft geweigerd. Wat erdoor komt wordt daarna alsnog per trade tegen zijn
    # eigen stop afgerekend, en dat is waar het over hoort te gaan.
    max_spread_bps:
      forex: 8.0
      crypto: 20.0
      stock: 45.0
      index: 25.0
      metal: 25.0
      commodity: 35.0

  # Ongepland nieuws. De kalender hiernaast weet wat eraan komt; deze laag weet
  # wat er NU gebeurt - de centrale bank die tussen vergaderingen door beweegt,
  # het verhaal dat om 03:00 uitbreekt terwijl de kalender een lege middag laat
  # zien.
  #
  # ER ZIT GEEN SENTIMENT IN, EN DAT KOMT ER OOK NIET. Tegen de tijd dat een
  # verhaal op een publieke feed staat is de beweging die het beschrijft al
  # geweest. De richting ervan handelen vanaf een VPS is kopen wat een ander al
  # gekocht heeft. Wat de vertraging wel overleeft is het feit DAT er iets aan
  # de hand is, en dat is een prima reden om je handen stil te houden.
  #
  # STAAT UIT. Geen van de feed-URL's kon bereikt worden vanuit de omgeving
  # waarin dit gebouwd is, dus geen enkel antwoordformaat is bevestigd. Draai
  # eerst op de VPS:
  #
  #     .venv-live\Scripts\python.exe scripts\verify_newsfeed.py
  #
  # Dat rapporteert per feed of hij antwoordt, wat er parst en welke valuta de
  # tagger vindt - plus precies de meting die het filter zou doen. Zet `enabled`
  # pas op true als dat er goed uitziet, en stel de drempels af op het echte
  # verkeer van die feeds. Een laag die stilletjes niets teruggeeft meldt een
  # rustige markt, en dat is het enige antwoord dat hij nooit mag verzinnen.
  headlines:
    enabled: false
    # Beide moeten waar zijn om te blokkeren: genoeg berichten om iets te
    # betekenen, en genoeg boven normaal om ongewoon te zijn. Los van elkaar
    # slaan ze mis - drie koppen is niets op EUR en een storm op NZD.
    min_headlines: 3
    spike_multiple: 3.0
    window_minutes: 20.0
    # Het normaal waar dat tegen afgezet wordt, per instrument. EUR en NZD
    # dragen op geen enkele wire vergelijkbaar verkeer, en één absolute drempel
    # over allebei betekent EUR altijd blokkeren of NZD nooit.
    baseline_hours: 12.0
    # Een marktbreed verhaal blokkeert op zichzelf. Het raakt elk paar even
    # hard, dus het lijkt op geen enkel paar op een piek, en de test hierboven
    # zou ze op het slechtst denkbare moment allemaal doorlaten.
    block_on_systemic: true
    # Afwijking van jouw regel "geen data = geen trade", en een smalle. Die
    # regel beschermt tegen een ontbrekende KALENDER, en de kalender faalt nog
    # steeds dicht - daar is niets aan veranderd. Staat deze laag donker, dan
    # draait het systeem op precies het veiligheidsniveau dat het altijd al
    # had. Op true betekent één hikkende RSS-host een dag zonder trades.
    block_when_unavailable: false

  session:
    # 20:00 UTC, niet de standaard 19:00. 19:00 is 21:00 in Amsterdam en dat is
    # gewoon de New Yorkse middag - een normaal verhandelbaar uur, geen dun boek.
    #
    # Wat die vrijdaggrens hoort te beschermen is een positie die het weekend in
    # gedragen wordt, en dat kan sowieso niet: de avonduitfasering sluit alles om
    # 20:15 (indices al om 20:00), ruim voor de sluiting om 21:00. En een trade
    # openen die de tijd niet meer heeft om zijn target te halen wordt al
    # geweigerd door `INSUFFICIENT_RUNWAY`, dat de resterende minuten tegen de
    # afstand tot het doel afweegt in plaats van tegen een vast uur.
    #
    # Er bleef dus een uur handelstijd liggen voor een risico dat twee andere
    # regels al dekken. Op 20:00 valt de grens samen met de uitfasering van de
    # indices en vijftien minuten voor die van forex, wat betekent dat hij nog
    # bindt zonder een normaal uur weg te gooien.
    block_friday_after: "20:00"

    # LOSSE AANDELEN GAAN NIET DOOR HUN EIGEN BEURSSLUITING HEEN.
    #
    # ENR (Siemens Energy) verloor -3,61R op een BROKER_SL. Een stop is per
    # definitie -1,00R, dus er ging 2,61R doorheen. Dat kan maar op een manier:
    # het aandeel stond stil terwijl de beurs dicht was en opende ergens anders.
    # De stop stond er wel, er was alleen geen markt om hem in te vullen.
    #
    # Een los aandeel handelt zo'n acht uur per dag en staat er zestien stil.
    # Elke regel in dit systeem is in R geschreven en R gaat ervan uit dat de
    # stop bindt. Zestien uur per dag doet hij dat niet, dus is een aandeel dat
    # blijft staan feitelijk een trade zonder stoploss - precies wat hier
    # verboden is.
    #
    # 15:30 UTC en niet later, want dat is Xetra's slot in de zomertijd en dus
    # de vroegste sluiting die dit account kan tegenkomen. Amerikaanse aandelen
    # worden daarmee eerder gesloten dan nodig; dat is de prijs voor een getal
    # dat het hele jaar door en op elke beurs klopt. Handel je alleen VS, dan
    # kan dit naar 19:45 - nooit later dan `evening_flat_from`.
    #
    # Dit dekt ook de instap: `INSUFFICIENT_RUNWAY` leest hetzelfde venster, dus
    # een aandeel dat de tijd niet meer heeft wordt niet meer geopend.
    evening_flat_asset_classes: [forex, stock]
    evening_flat_by_class:
      index: "20:00"
      stock: "15:30"

    # De Aziatische sessie erbij, op verzoek van de eigenaar: de VPS is er om
    # 24/7 te draaien en de rekening stond 's nachts stil.
    #
    # Dit gaat van 7 handelbare uren per dag naar 21. De unie van de drie
    # sessies is 00:00-21:00 UTC. Wat dicht blijft is 21:00-00:00, en dat is
    # geen conservatisme maar de rollover: de swap-omslag valt daarin, de
    # spread is er een veelvoud van normaal, en `rollover_block` en de
    # avond-uitfasering staan er al. In dat gat "handelen" toestaan zou
    # toneelspel zijn - het spread-filter weigert daar toch bijna alles.
    #
    # Waarom dit veilig genoeg is om aan te zetten, en niet omdat de nacht
    # rustig is: het spread-filter meet per instrument *per uur van de dag* en
    # doet dat elke cyclus, ook in de uren waarin nooit gehandeld werd. Er ligt
    # dus al een gemeten nachtnormaal per markt om tegen af te wegen, en 03:00
    # wordt beoordeeld tegen 03:00 en niet tegen de Londense ochtend. Het
    # liveliness-filter doet hetzelfde voor "de markt is in slaap gevallen".
    #
    # De conviction-vloer staat inmiddels op 75 voor alle uren, dus de nacht
    # krijgt geen eigen soepelere lat - hij krijgt dezelfde strengere.
    #
    # Wat hier mis kan gaan: dun boek in de Aziatische uren op EUR-crosses en
    # Europese indices. ASX200 en JPY-paren zijn er juist het levendigst. De
    # twee filters hierboven horen dat onderscheid per markt te maken; als
    # `why_no_trades` na een paar nachten laat zien dat het toch de dunne
    # markten zijn die erdoor komen, gaat asia er weer af.
    tradable_sessions: [asia, london, newyork]

    # En dat is precies wat er gebeurde. Twee trades in de nacht van 12
    # augustus: NDX100 short om 00:51 UTC, vijf uur nadat de Nasdaq dichtging,
    # en EURCAD short om 03:03 met Frankfurt én Toronto gesloten. Allebei door
    # het filter heen, want Azië liep en Azië staat in de lijst — terwijl Azië
    # geen van beide instrumenten prijst.
    #
    # `asia` gaat er hier niet af, want dat zou de JPY- en AUD-paren treffen
    # die op dat moment juist hun eigen markt open hebben. In plaats daarvan
    # stelt het filter de vraag per instrument: is de markt die dít ding prijst
    # op dit moment open. Een instrument waarvan dat niet te bepalen is gaat er
    # altijd doorheen — zie `filters/home_session.py`.
    #
    # Dit levert mínder trades op, niet meer. Wat het weghaalt zijn de trades
    # die er nooit hadden moeten zijn.
    #
    # UIT, op uitdrukkelijke instructie van de eigenaar nadat bovenstaande was
    # voorgelegd: er moet dag en nacht gehandeld worden, en de spread is wat de
    # bescherming moet leveren. Het filter blijft in de code staan en is met
    # deze ene regel weer aan te zetten.
    #
    # Wat dit dus terugbrengt: EURCAD om 03:00 met Frankfurt en Toronto dicht,
    # en NDX100 uren nadat de Nasdaq sloot. De reden dat de spread dat niet
    # afvangt staat in `filters/home_session.py` — een dun boek hoeft geen
    # brede spread te tonen. Wat de reviewer nu wel meekrijgt, ook zonder dit
    # filter, is `home_session_open: false` in de payload; dat blijft staan.
    require_home_session: false

risk:
  # De houding knijpt niet meer af na verliezen. Zie risk/posture.py.
  posture_throttle: false

  # De inzet van een GEWONE trade. Van 2,0 naar 3,0 op eigenaarsinstructie:
  # "hij speelt nu continu met centen". Op EUR 174 is 2% een risico van EUR
  # 3,48, en na EUR 0,22 commissie houdt een winnaar van 1R daar ruim drie euro
  # van over. Dat is de klacht, en die is terecht.
  #
  # WAT DIT NIET OPLOST, en dat hoort hier te staan omdat de verleiding groot
  # is: commissie is EUR 5,50 PER LOT. Groter handelen schaalt winst, verlies
  # en commissie alledrie met dezelfde factor. De verhouding tussen kosten en
  # opbrengst verandert hier geen millimeter van. Dit maakt de uitkomsten
  # groter, niet beter.
  #
  # De meting blijft wel zuiver: R is de breedte van de stop, dus elke
  # R-kolom in de scorecard is voor en na deze wijziging vergelijkbaar. Alleen
  # de eurokolom schaalt mee. Grootte en edge staan los van elkaar.
  risk_per_trade_pct: 3.0
  # Het absolute plafond dat geen enkele modus mag overschrijden. Van 6 naar 9,
  # mee met het plafond van de conviction-ladder hieronder.
  #
  # DIT IS EEN VAN DRIE PLAFONDS EN ZE MOETEN SAMEN OMHOOG. Alleen
  # `conviction.ceiling_pct` verhogen doet niets: de sizer klemt elke inzet
  # tegen dit getal, en `modes.experimental_live.max_risk_per_trade_pct` klemt
  # er nog een derde keer overheen. Een validator eist bovendien dat de modus
  # deze waarde niet overschrijdt. Twee van de drie verhogen levert een stille
  # no-op op — de config zegt 9%, de rekening handelt 6%.
  max_risk_per_trade_pct: 8.0

  # Van 2.0x naar 1.5x de door MT5 berekende ordermargin. De echte broker-
  # margin moet nog steeds volledig beschikbaar zijn; alleen de extra reserve
  # daalt van 100% naar 50%. Een mislukte marginberekening blijft fail-closed.
  margin_safety_factor: 1.5

  # Hoeveel eigen vermogen één gelijktijdige positie "koopt".
  #
  # Een vast aantal slots is de verkeerde vorm voor een account dat moet
  # groeien. Twee klopt bij EUR 100 — een derde gelijktijdige trade daar is er
  # een die het account bij de minimum lot toch niet kan uitdrukken — en klopt
  # niet meer bij EUR 400.
  #
  # Bij EUR 75 per slot:  87 -> 2 (de bodem),  225 -> 3,  300 -> 4 (het plafond
  # van micro_live). Een drawdown draait dat vanzelf weer terug. Het plafond
  # per modus blijft absoluut; groei loopt ernaartoe, nooit erdoorheen.
  # Owner-authorised experiment: four live slots at the current account size.
  # Sizing, margin, correlation and per-symbol rules still run for each one;
  # this changes capacity, not the 2% budget of an ordinary entry.
  #
  # Four slots is now a ceiling that `max_total_open_risk_pct` below can reach
  # before the slots do. Two maximum-conviction trades fill 12% of the account
  # and the third waits, however many slots are free.
  equity_per_position: 0
  min_concurrent_positions: 4

  # The most the whole book may risk at once, as a percentage of equity.
  #
  # This exists because conviction-scaled staking exists. Four slots at a
  # conviction ceiling of 6% is 24% of a 140 EUR account on the table
  # simultaneously, with the daily and weekly loss limits switched off, and not
  # one per-trade rule would have noticed — every one of those four trades is
  # individually within its limit. Six percent is a decision about a trade;
  # twenty-four percent is a decision about the account.
  #
  # Measured against each position's CURRENT stop, so a winner whose stop has
  # walked to break-even stops consuming the budget and genuinely gives the
  # room back. A position with no stop at the broker counts its full notional.
  #
  # A trade that cannot get the ordinary 2% is refused rather than squeezed
  # into whatever fraction is left: a 0.4% position on this account cannot be
  # expressed at the minimum lot anyway.
  #
  # Zero disables it. In Experimental Live the armed contract overrides this
  # value outright — see promotion/experimental.py — so an edit here cannot
  # widen what the live account is allowed to stake.
  max_total_open_risk_pct: 16.0

  # De inzet schaalt mee met hoe overtuigd de reviewer is. Zie
  # config/schema.py ConvictionRiskConfig voor waarom het op ZIJN vertrouwen
  # rijdt en niet op de conviction-score van de engine.
  #
  # 0.50 en lager -> 2,0%   (de gewone inzet, precies wat het hiervoor was)
  # 0.55          -> 3,0%
  # 0.60          -> 4,0%
  # 0.65          -> 5,0%
  # 0.70 en hoger -> 6,0%
  #
  # HERIJKT OP 13 AUGUSTUS, en dit is een fout van mij die de meting meteen
  # blootlegde. De ladder liep van 0,70 tot 0,90. `review_value.py` meet dat
  # deze reviewer op dit account tussen 0,25 en 0,72 antwoordt, over vier
  # banden. De hele ladder lag dus bóven zijn bereik: elke goedkeuring zou de
  # vloer van 2% hebben gekregen en de functie had nooit één keer gevuurd.
  #
  # 0,70 is nu het plafond omdat dat het hoogste is wat hij ooit geantwoord
  # heeft, niet omdat het een mooi rond getal is. Herzien zodra er dertig
  # reviews meer zijn en de spreiding verschoven blijkt.
  conviction_risk:
    enabled: true
    floor_pct: 3.0
    ceiling_pct: 8.0
    confidence_floor: 0.50
    confidence_ceiling: 0.70

  # Een positie waarvan de beurs dicht is bezet geen slot meer.
  #
  # AANLEIDING, en het was geen theorie. Op 10 augustus stonden er drie
  # aandelen-CFD's open (ba, con, dbk). Hun beurs sluit om 17:00 Amsterdamse
  # tijd. Daarna kan er niets meer mee: niet sluiten, geen stoploss verzetten,
  # niet veiligstellen. Ze hielden wel drie van de vier slots bezet, dus het
  # systeem kon de hele avond nog precies een trade openen.
  #
  # WAT DIT NIET DOET. De bevroren positie houdt zijn risico. Zijn slot
  # vrijgeven betekent dat het gelijktijdige risico boven vier posities uit kan
  # komen zolang een beurs dicht is, en bij de opening staat alles weer live.
  # Wat het wel begrenst: margin (per order tegen de echte vrije margin
  # gecontroleerd, nu al de krapste rem op dit account), het correlatiefilter,
  # de regel van een idee per symbool, en elke entry-poort.
  #
  # Een quote mag tien minuten oud zijn voordat de markt als dicht geldt. Het
  # spread-filter kapt al op 120 s voor aandelen, maar dat beantwoordt een
  # andere vraag ("is deze prijs vers genoeg om op in te stappen") en die
  # drempel hier gebruiken zou een slot teruggeven zodra een dun aandeel
  # midden in de sessie even stilvalt.
  release_slots_when_unmanageable: true
  unmanageable_quote_age_seconds: 600

  # Commissie per lot per kant, in euro. Dit is geen boekhouding maar risico.
  #
  # Gemeten, niet geschat: een AUDNZD-stop-out van 0,06 lot kostte EUR 1,93
  # tegen een gemodelleerde 1R van EUR 1,53, en EUR 0,33 van dat gat was
  # commissie — bevestigd tegen de deal in de terminal. Dat is EUR 5,50 per lot
  # round trip, dus EUR 2,75 per kant.
  #
  # Elke drempel in dit systeem is uitgedrukt in R. Een R die een vijfde van
  # het echte verlies weglaat laat de give-back te laat wapenen, laat de
  # winst-grendel minder vastzetten dan hij zegt, en maakt elk
  # verwachtingsgetal mooier dan het is.
  #
  # Dit prijst ook krappe stops voor het eerst eerlijk. Commissie is een vaste
  # kost per lot: op een stop van 2 pips is het een derde van je risico, op 20
  # pips een afrondingsfout.
  commission_per_lot_per_side: 2.75

  # EN DIT GELDT ALLEEN VOOR FOREX. Alle andere klassen betalen NUL.
  #
  # De 2,75 hierboven is correct gemeten en werd vervolgens op de hele
  # catalogus toegepast, want deze tabel stond leeg en dan valt elke klasse
  # terug op dat ene getal. Eightcap rekent bij indices, metalen, crypto en
  # aandelen geen aparte commissie — dat zit in de spread.
  #
  # BEWIJS, uit de rekening zelf op 24 augustus. Negen gesloten trades met in
  # totaal EUR 0,67 commissie. De enige forex erin was USDJPY 0,07 + 0,05 =
  # 0,12 lot, en 0,12 x 5,50 = EUR 0,66. Alle SPX500-, SG30-, BTCUSD- en
  # XAUUSD-trades in datzelfde venster droegen samen NUL bij, en het
  # detailpaneel van de SPX500-deal zei het met zoveel woorden:
  # `Commission: 0.00`.
  #
  # WAT DE FOUT KOSTTE, en het is meer dan een cosmetisch getal, want deze
  # waarde loopt door vier plekken die allemaal geld raken:
  #
  #   * `position_sizer` telt commissie bij de kosten per lot op, dus elke
  #     index-, goud- en cryptotrade werd KLEINER gesized dan bedoeld
  #   * `cost_share` weigert stops die te krap zijn voor hun kosten, en op een
  #     verzonnen EUR 5,50 weigert hij stops die prima waren
  #   * `round_trip_cost_price` gaat in `cost_r` van de doelzoeker, dus doelen
  #     werden geweigerd die zichzelf wel degelijk terugverdienden
  #   * `_worth_paying_to_leave` schat wat uitstappen kost. Op een verzonnen
  #     commissie is uitstappen te duur en houdt het systeem een verliezer
  #     vast tot de stop — precies het gedrag waar HEALTH_EXIT op stukliep.
  #
  # Nul is hier geen aanname maar een meting, en als de broker dit ooit
  # verandert is dat zichtbaar in de deals zelf.
  commission_by_asset_class:
    index: 0.0
    metal: 0.0
    crypto: 0.0
    commodity: 0.0
    stock: 0.0

  # Slippage die een stop-out werkelijk oploopt, in pips per assetklasse.
  #
  # Gemeten: een AUDNZD-stop stond op 1.19722 en werd gevuld op 1.19705 —
  # 1,7 pip dwars door de stop heen, op een stop van 5 pips. Een stop is een
  # verzoek, geen garantie.
  #
  # Eén waarneming per klasse is weinig. Draai `scripts/execution_noise.py`
  # als er meer trades zijn en stel bij op wat de data zegt.
  stop_slippage_pips:
    forex: 1.7
    metal: 2.0
    index: 2.0

  # Hoeveel van je risico commissie plus slippage mogen opeten.
  #
  # Op die AUDNZD-trade was dat samen 56% van 1R, en hij kwam uit op -1.48R
  # tegen een plan van -1.00R. Bij die verhouding wordt niet de strategie
  # getest maar de kosten van handelen, en die winnen.
  #
  # Van 25% naar 35% om betaalbare quick entries niet dubbel te blokkeren nadat
  # hun spread/stop-verhouding al is goedgekeurd. Een volle stop kan daardoor
  # rond -1.35R uitkomen in plaats van -1.25R. Boven 35% wordt nog steeds
  # geweigerd met SL_TOO_TIGHT_FOR_COSTS.
  max_cost_share_of_risk: 0.35
  # Het absolute plafond. Een modus mag hier lager gaan, nooit hoger — de
  # loader weigert dat bij het inladen, en dat is precies hoe deze regel is
  # opgevallen toen micro_live op 4 werd gezet terwijl dit nog 2 was.
  max_concurrent_positions: 4

  # De anti-martingale-halvering staat uit op DIT account, en alleen omdat hij
  # hier niet doet waar hij voor bedoeld is.
  #
  # Hij hoort de inzet te verkleinen als het bewijs dat de edge werkt het zwakst
  # is. Op dit account verkleint hij niks — hij zet het handelen stil. Dat is
  # een schakelaar die alleen omgaat door te winnen, wat niet kan zolang hij
  # aan staat. Precies dezelfde val als de houdingsrem hierboven.
  #
  # De rekensom, bij 2% experimenteel-live risico en een 0,01-lot minimum dat
  # inclusief commissie ongeveer EUR 1,05 kost op een stop van 10 pips en
  # EUR 2,06 op 20 pips:
  #
  #   saldo    budget   gehalveerd   breedste stop die de helft nog uitdrukt
  #   EUR  88   1,77       0,88        ~8 pips
  #   EUR 123   2,47       1,23        ~11 pips
  #   EUR 250   5,00       2,50        ~24 pips
  #
  # De echte stops op dit account liggen op 10 tot 12 pips. Bij EUR 123 zou de
  # halvering dus nog steeds ruwweg de helft van de setups weigeren met
  # TRADE_SKIPPED_UNDERCAPITALIZED, en precies tijdens een verliesreeks. Dat is
  # geen risicobeheer, dat is een storing met een nette naam.
  #
  # Terug naar 0.5 rond EUR 250, waar een gehalveerde inzet een stop van 20+
  # pips nog kan uitdrukken. De drempel blijft op 3 staan zodat de verliesreeks
  # geteld en vastgelegd blijft worden — alleen zonder er iets mee te doen, en
  # sinds `risk_manager.risk_multiplier` ook zonder te beweren van wel.
  losing_streak_risk_multiplier: 1.0

  # Van 2.0 via 1.5 en 1.1 naar 1.0. Dit is nu gelijk aan de target-trimvloer.
  #
  # Die 2.0 is afgestemd op de stops van vóór `min_stop_atr`. Die vloer maakt de
  # stop breder waar hij in de ruis lag; het target verandert niet mee, dus
  # dezelfde trade scoort nu mechanisch lager op reward/risk. In de laatste
  # cyclus vielen er acht af op RR_BELOW_MINIMUM die daarvoor door zouden zijn
  # gekomen. Het getal verlagen houdt de strengheid gelijk aan wat hij was.
  # De vorige combinatie was intern tegenstrijdig: confluence mocht tot 0.9R
  # bijsnijden, maar deze laag weigerde daarna alles onder 1.1R. Op 1.0 blijft
  # minder dan de mogelijke stop verdienen verboden, terwijl een exact 1R-plan
  # niet langer door een latere laag wordt weggegooid.
  # 0.60, in de pas met `analysis.confluence.minimum_r_multiple`. Een validator
  # op Settings weigert nu elke combinatie waarin deze twee uit elkaar lopen, in
  # plaats van dat ze met de hand gelijk worden gehouden — de notitie hierboven
  # beschrijft precies wat er gebeurt als dat een keer misgaat, en met de hand
  # gelijkhouden werkt tot de eerste keer dat iemand er één aanpast.
  #
  # Minder verdienen dan de stop kan kosten is hiermee toegestaan, en dat is
  # bewust: 0.60R met een gemeten trefkans van 70% is een betere trade dan 1.00R
  # die een derde van de tijd gehaald wordt. Welke van de twee het is, bepaalt
  # de verwachtingswaarde-zoeker in de engine, niet dit getal.
  #
  # 0.60, mee met `analysis.confluence.minimum_r_multiple` — zie de motivatie
  # en het aanvaarde risico daar. De validator weigert elke combinatie waarin
  # deze twee uit elkaar lopen, dus ze bewegen altijd samen.
  min_risk_reward: 0.60
  max_trades_per_day: 0
  max_trades_per_week: 0

  # Daily and weekly loss limits off, at the operator's explicit instruction
  # after the halt below was traced to trades the system did not place.
  #
  # These are pacing limits. They stop a bad period from continuing and they
  # reset with the calendar, which is exactly why they are the loosenable ones:
  # a day that goes wrong is paused, not ended. Switching them off means a bad
  # day can run its full course.
  #
  # The peak-to-current breaker is also explicitly off in the armed
  # Experimental Live contract. The remaining unconditional capital backstop is
  # the fixed EUR 50 floor in promotion/experimental.py. Re-arming does not move
  # that floor. Also retained: 2% risk on an ordinary trade, a 6% ceiling that
  # only a reviewer confidence of 0.90 reaches, a 12% cap on total open risk,
  # four position slots, every filter and Claude's veto.
  daily_loss_limit_pct: 0
  weekly_loss_limit_pct: 0

modes:
  micro_live:
    # The per-trade CEILING, not the ordinary stake. An ordinary approval is
    # still sized at `risk.risk_per_trade_pct`; this is the most that
    # conviction scaling may reach, and the sizer clamps to it.
    max_risk_per_trade_pct: 8.0
    max_sl_pips: 30
    max_trades_per_day: 0
    daily_loss_limit_pct: 0
    # Four is the owner-authorised experimental-live capacity at every equity
    # inside this mode; `risk.equity_per_position: 0` disables slot scaling.
    # Four is also where it stops after the account has grown inside this mode's
    # EUR 500 range. What now binds before the slots do is
    # `risk.max_total_open_risk_pct`: two maximum-conviction trades reach the
    # 12% aggregate ceiling with two slots still free, and with the daily and
    # weekly limits switched off on this account that is as far as simultaneous
    # exposure should go.
    max_concurrent_positions: 4
    max_journal_detail: true
    min_equity: 50
    max_equity: 500

trade_management:
  # Still needs the position path plus an independent chart family. Alleen het
  # moment schuift op: bevestigd falen mag nu ingrijpen op -0,15R in plaats van
  # -0,25R. De broker-SL blijft de onvoorwaardelijke achtervang.
  #
  # Van 0,25 naar 0,15 op eigenaarsinstructie, met dit als onderbouwing:
  # HEALTH_EXIT deed 12 trades, 0 gewonnen, -36,82 EUR bij een lift van
  # -0,06R. Die lift leest als "ingrijpen was een wassen neus", maar zegt iets
  # preciezers — die trades bereikten hun stop tóch. En voor een trade die
  # sowieso verloren was is eerder weggaan strikt goedkoper: dezelfde baseline,
  # een kleiner verlies.
  #
  # Wat dit NIET verzwakt: de eis blijft trajectory PLUS een onafhankelijke
  # chartfamilie PLUS severity >= 0,45. Eén lezing kan hier nog steeds niks.
  thesis_invalidation_at_r: 0.15

  # DE UITGANGSDREMPEL, EN DE ENE FAMILIECOMBINATIE DIE ER NIET BIJ KON.
  #
  # 0,75 was tot nu toe een constante in de code. De familiegewichten zijn
  # structure 0,45, trajectory 0,50, drift 0,35, liquidity 0,30, en de code
  # noteert zelf welk paar daardoor buiten de boot viel:
  #
  #     trajectory + structure   0,95   haalt het
  #     trajectory + drift       0,85   haalt het
  #     trajectory + liquidity   0,80   haalt het
  #     structure  + drift       0,80   haalt het
  #     structure  + liquidity   0,75   haalt het precies
  #     drift      + liquidity   0,65   HAALT HET NIET
  #
  # Op 0,65 doet dat laatste paar wat deze klasse over zichzelf beweert: twee
  # onafhankelijke families die het eens zijn kunnen een trade sluiten. Een
  # trade waarvan de drift is gedraaid EN de kosten zijn opgeblazen kreeg tot
  # nu toe alleen een strakkere stop, en liep daarna vaak door naar de volle
  # stop.
  #
  # DE VEILIGHEID BLIJFT INTACT, en dat is meetbaar en niet beloofd. De
  # zwaarste losse familie is trajectory op 0,50, dus op 0,65 kan geen enkele
  # familie deze drempel in z'n eentje halen — met 0,15 marge. De schemavloer
  # staat op 0,55 en `assess` klemt daar nogmaals op. Bovendien degradeert de
  # corroboratieregel een exit van één familie sowieso naar een stopverkrapping.
  # "Deze trade staat op verlies" sluit dus nog altijd niks.
  health_broken_at: 0.65
  # DE PROFIT-LOCK NAAR WAAR DEZE TRADES ECHT LEVEN.
  #
  # Hij armeerde op 0,7R en borgde de helft van de top. Over 39 gesloten
  # trades in 48 uur redde dat er PRECIES EEN, goed voor +0,18R — want maar
  # vier van die 39 zagen ooit 0,6R en geen enkele 1,5R. De hele ladder
  # (break-even 0,6 / lock 0,7 / ATR-trail 1,5) hing boven de trades.
  #
  # Diezelfde 39 trades, opnieuw gerekend met de lock op 0,20R en 0,6:
  #
  #     armeert  fractie  gered   nu      met lock   winst
  #       0.70R      0.5      1   +4.60R    +4.79R   +0.18R   <- hoe het stond
  #       0.40R      0.6      5   +4.60R    +5.57R   +0.97R
  #       0.25R      0.6     10   +4.60R    +5.89R   +1.29R
  #       0.20R      0.6     19   +4.60R    +6.34R   +1.74R   <- hier
  #
  # +1,74R is rond de EUR 17 over twee dagen, ofwel 38% meer dan er binnenkwam.
  #
  # WAAROM DEZE REGEL EN NIET DE HEALTH-TIGHTEN: de lock meet vanaf de TOP en
  # ratelt dus mee omhoog, hij draait elke beheerronde, en hij zit bij de
  # BROKER — hij overleeft een herstart van de VPS en het wegvallen van dit
  # proces om drie uur 's nachts. De health-tighten zette de stop eenmalig op
  # de helft van wat de trade op DAT moment waard was en liet hem daarna staan:
  # een positie die op +0,12R werd geraakt kreeg een stop op +0,06R, liep door
  # naar +0,59R, en kwam terug om op die +0,06R te eindigen. Niet het securen
  # was fout, het bevriezen was fout.
  #
  # VOORBEHOUD: die +1,74R is een BOVENGRENS. Hij neemt aan dat de lock elke
  # teruggezakte trade op de bodem opvangt, en telt niet mee dat een stop op
  # 60% van de top ook een trade kan pakken die daarna alsnog was hersteld.
  # Met 40% ruimte onder de top is dat zeldzaam, maar niet nul. Volgende
  # `scorecard --days 2` zegt of het klopt.
  profit_lock_from_r: 0.20
  profit_lock_fraction: 0.6

  # SPREAD_SQUEEZE WEER AAN, MAAR NU MET DRIE TESTS DIE HIJ NIET HAD.
  #
  # Hij was elf van de elf keer negatief: acht in de replay van 17 augustus,
  # elk slechter dan de positie met rust laten (hij bankte +0.38R waar niks
  # doen +1.02R gaf), en daarna live EURAUD -0.35R, NDX100 -0.44R en FRA40
  # -0.38R. Uitzetten was het eerlijke antwoord op dat cijfer.
  #
  # Maar het verschijnsel is echt. Een short wordt gesloten op de ASK, een long
  # op de BID. Dunt het boek uit, dan schuift precies de kant waarop jouw stop
  # afgaat ernaartoe, terwijl de markt stilstaat. Een NZDJPY-short met 5,9 pips
  # ruimte en 6 pips spread wordt uitgestopt zonder dat de markt ooit tegen die
  # trade was. Dat is geen mening, dat is het orderboek.
  #
  # Wat er mis was, was niet WAT hij keek maar HOE SNEL hij het geloofde:
  #
  #   1. Hij vuurde op de EERSTE meting. Alle elf blowouts waaiden over en de
  #      trade liep door zonder ons. Nu moet de toestand 30 seconden EN minstens
  #      twee metingen standhouden. Wachten kost niks: de stop staat er de hele
  #      tijd, en een quote die hem echt gaat pakken is over een halve minuut
  #      nog steeds breed.
  #
  #   2. Hij vergeleek de spread alleen met de RUIMTE tot de stop. Dat zijn twee
  #      verschillende klachten — een brede quote is er een, een dichtbije stop
  #      de andere, en alleen de eerste is een reden om eruit te gaan. Nu moet
  #      de spread ook minstens 2x zo breed zijn als wat DEZE positie gewend is.
  #
  #   3. Onder de tien metingen zegt hij niks. Te weinig om iets abnormaal te
  #      noemen, en dan is vasthouden het veilige antwoord.
  #
  # En de val waar FRA40 in liep is apart dichtgetimmerd: `HEALTH_TIGHTEN` trok
  # de stop drie keer achter elkaar naar de prijs, en de 0,89 ruimte waar de
  # squeeze op reageerde had die tightener zelf net gemaakt. Zie
  # `min_stop_room_spreads` — een stop mag nooit dichter bij de prijs komen dan
  # de spread kan overbruggen.
  #
  # WANNEER DIT WEER UIT MOET: `scorecard --days 7`. Blijft hij negatief scoren
  # tegen zijn eigen onaangeroerde stop, dan is de volharding niet de fix en
  # gaat `spread_squeeze_share` op 0.0.
  spread_squeeze_share: 0.75
  spread_squeeze_persist_seconds: 30.0
  spread_squeeze_abnormal_multiple: 2.0
  spread_squeeze_min_samples: 10

  # Geen vaste geldgrens als primaire exit. De gratis local-history adviser
  # vergelijkt de volledige actuele positie met eerdere Claude-supervisies en
  # mag bij sterke overeenkomst sluiten. SL, kapitaalbodem en mechanische
  # nooduitgangen blijven vangrails; ze zijn geen winstdoel.
  bank_enabled: false

  # Wanneer de AI wakker wordt terwijl winst wegloopt. Dit sluit NIETS. Het is
  # de drempel waarbij de vraag gesteld wordt; het antwoord komt van de
  # beoordeling zelf, niet van dit getal.
  #
  # Op 0,25 werd er pas gebeld nadat een kwart weg was: een piek van EUR 1,00
  # vraagt dan pas op EUR 0,75. Beide winstladders praten alleen bij een NIEUWE
  # top, dus tussen EUR 1,00 en EUR 0,75 keek er letterlijk niets naar de
  # positie. Op 0,15 valt die vraag op EUR 0,85 — terwijl er nog iets te
  # beslissen valt in plaats van erna.
  supervision_giveback_trigger_fraction: 0.15

  # Dezelfde vraag aan de verliezende kant, en die ontbrak volledig. Alle vier
  # de triggers hierboven knippen het negatieve deel weg met `max(x, 0)`, dus
  # een positie kon van -0,1R naar -0,8R lopen zonder dat er iets overheen ging.
  # Wat er overbleef was de review van elke vijftien minuten.
  #
  # Op EUR 133 equity: de eerste geldsport valt op EUR 0,47, de tweede op
  # EUR 0,93. Dus "hey, zakt dit door? dan liever nu eruit voor 50 cent" wordt
  # daadwerkelijk gevraagd in plaats van toevallig opgemerkt.
  #
  # De geldsport is krapper dan die aan de winstkant (0,35 tegen 0,50) en dat is
  # geen symmetriefout. Een gemiste winst kun je morgen opnieuw pakken; een
  # verlies kun je niet terugdraaien.
  supervision_loss_step_r: 0.25
  supervision_loss_step_equity_pct: 0.35

  # Vier minuten stilstand in plaats van zes, op verzoek van de eigenaar.
  #
  # WAT DE ZES VERDEDIGDE: ongeveer een M5-bar plus bevestiging. Lang genoeg dat
  # een gewone pullback binnen een lopende beweging hem niet raakt, kort genoeg
  # om nog bij de top te zijn als hij vuurt. Vier is minder dan een hele M5-bar,
  # dus dit gaat vaker vuren op een pauze die nog geen einde is.
  #
  # WAT DAT DRAAGLIJK MAAKT: sinds 18 augustus vraagt deze regel eerst de
  # health-read. Een gezonde lezing verdubbelt het geduld, dus in de praktijk is
  # het vier minuten als er iets mis is en acht als er niks mis is. De oude zes
  # gold onvoorwaardelijk. Een nieuwe top zet de klok sowieso op nul, dus een
  # trade die blijft werken kan hier nog steeds niet uit vallen.
  #
  # Terugdraaien is dit getal. `scorecard.py` heeft er een kolom voor: PEAK_STALL
  # stond op een lift van -0,64R toen hij nog blind was, en die moet kantelen.
  peak_stall_minutes: 4.0

  # Het leren van de bankdrempel staat UIT, en dat is op bewijs.
  #
  # `management_baselines` speelde tien gebankte trades na tegen hun eigen
  # onaangeraakte stop en doel, over dezelfde uren:
  #
  #   PEAK_STALL       3 trades   pakte +0,43R   vasthouden gaf +1,92R   -1,49R
  #   PROFIT_BANKED    3 trades   pakte +0,33R   vasthouden gaf +1,20R   -0,87R
  #   SPREAD_SQUEEZE   3 trades   pakte +0,42R   vasthouden gaf +0,93R   -0,51R
  #
  # Negen van de tien deden het slechter dan niets doen. Deze regels winnen
  # elke keer dat ze vuren, en winnen veel minder dan de trade ging opleveren.
  # Twaalf-uit-twaalf las als het beste onderdeel van dit systeem en was in
  # werkelijkheid de duurste gewoonte erin.
  #
  # De geleerde drempel kan de lat alleen verlagen, dus die laat het eerder en
  # vaker gebeuren. Dat is precies de verkeerde kant op tot de baseline zegt
  # dat vroeg banken loont. Zet hem terug op true zodra die kolom kantelt.
  use_learned_bank_threshold: false

  # Bijkopen op een winnaar, en alleen als hij nog loopt.
  #
  # WAT ER MIS WAS. `min_existing_r` stond op 0,25 en `bank_at_r` op 0,30. Die
  # twee vochten: de bankregel sluit een haperende winnaar op 0,30R, dus de
  # scalp kon alleen vuren in het spleetje van vijf honderdsten daaronder. En
  # de guard kijkt elke seconde of hij moet banken terwijl de scanner eens per
  # cyclus naar bijkopen kijkt, dus die zestig-tegen-een liep ook nog eens de
  # verkeerde kant op. Praktisch was het een uitgeschakelde functie die eruitzag
  # alsof hij aanstond.
  #
  # WAT ER NU STAAT. De vloer ligt op 0,60R, boven de bankdrempel. Een leg die
  # dáár nog open is, is er een die de pace-check als doorlopend beoordeelde --
  # want was hij gaan haperen, dan had de bankregel hem al genomen. Precies de
  # leg waar bijkopen over gaat: bewezen richting, beweging nog intact.
  #
  # WAT HET RISICO BEGRENST, en dit is de belangrijkste regel van de vier:
  # `require_stop_beyond_entry`. Er mag alleen gestapeld worden op een leg
  # waarvan de stop bij de broker op of voorbij de instap staat. Die leg kan
  # dus niets meer verliezen, en het slechtste geval van een hele campagne is
  # het kwart-risico van de bijkoop -- ongeveer 0,5% -- in plaats van elke leg
  # die tegelijk zijn volle 2% raakt. Gecontroleerd op de positie die de broker
  # aanhoudt, niet op het plan in het journaal: een journaal dat break-even
  # zegt terwijl de broker de wijziging nooit kreeg is juist wat dit weigert.
  #
  # Daarbovenop: een verse analyse met conviction >= 85 (je drempel is 40),
  # Claude >= 0,80 (normale vloer 0,55), dezelfde richting, en een kwart van de
  # normale inzet. Origineel plus twee scalp-legs is het harde plafond, en maar
  # een symbool tegelijk.
  #
  # Wat dit NIET is: averaging down. Elke leg moet in de winst staan en boven
  # water beschermd zijn voordat de volgende mag. Een verliezende leg sluit de
  # hele campagne af.
  pyramiding:
    enabled: true
    max_legs_per_symbol: 3
    min_existing_r: 0.60
    require_stop_beyond_entry: true
    minimum_conviction: 85
    risk_multiplier: 0.25
    minimum_ai_confidence: 0.80
    max_active_symbols: 1
    counts_toward_position_limit: false

  # Positions opened by hand in MT5 use magic 0. Jarvis attaches a measured
  # M15 ATR plan when SL/TP is missing, records the plan, and then runs exactly
  # the same one-second mechanical management and Claude supervision over it.
  manual_positions:
    enabled: true
    magic_numbers: [0]
    stop_timeframe: M15
    stop_atr_multiple: 1.5
    target_reward_risk: 1.5

# Leren op het volume dat dit account echt draait.
#
# WAT ER MIS WAS, en het was dubbel mis. De standaardwaarden zijn gekalibreerd
# op een systeem dat honderden trades per maand doet. Op 47 trades betekende
# dat:
#
#   1. `selection_min_trades: 40` per segment. Met 47 trades over 26
#      instrumenten haalt geen enkel segment dat. Nooit actief.
#   2. En als hij wél draaide deed hij niets. Reken de longs door met de oude
#      getallen: 27 trades, gemiddeld -0,257R, shrink 27/(27+80) = 0,25, keer
#      6 punten = -0,39 punt. De scores lopen van 38,8 tot 58,5. Anderhalve
#      procent van het bereik. Onzichtbaar.
#
# Met deze getallen wordt het:
#
#   LONG   27 trades, -0,257R  ->  -2,00 punt
#   SHORT  20 trades, -0,101R  ->  -0,67 punt      verschil 1,33 punt
#
# Een echte duw op een bereik van 20 punten, nog altijd afgetopt op +/-4.
#
# De shrinkage is wat dit veilig houdt, niet de vloer. Een segment met tien
# trades wordt vermenigvuldigd met 10/(10+25) = 0,29 en krijgt dus een
# evenredig kleine stem in plaats van eerst niets en een trade later alles.
#
# EN HET BELANGRIJKSTE: dit is uitsluitend volgorde. `learned_alignment` gaat
# naar `selection_key` en die wordt alleen gebruikt in `analysed.sort(...)`.
# Het raakt de score die tegen de drempel van 40 wordt gehouden niet aan, dus
# het kan een afgewezen setup nooit alsnog geldig maken en nooit een positie
# vergroten. Het kan alleen bepalen wat er eerst aan de beurt is van dingen die
# al door elke poort heen zijn.
learning:
  selection_min_trades: 15
  selection_shrinkage_trades: 25
  selection_points_per_r: 15.0
  selection_modifier_cap: 4.0
  selection_ensemble_strength: 1.5
  selection_ensemble_modifier_cap: 6.0
  selection_raw_conviction_weight: 0.35
  selection_independent_family_bonus: 1.5
  selection_independent_family_cap: 3
  selection_outcome_floor_r: -1.0
  selection_outcome_cap_r: 2.0
  selection_dimension_weights:
    setup_horizon: 1.5
    setup_family: 1.0
    detector: 1.0
    regime: 1.0
    session: 0.8
    score_band: 0.8
    asset_class: 0.6
    horizon: 0.6
    direction: 0.5

